<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        /* Navigation */
        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        
        /* UI Components */
        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.85), rgba(5, 7, 10, 0.85)); display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.3); width: 100%; max-width: 1200px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); font-size: 32px; }
        
        .course-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; margin-top: 30px; }
        .course-card { background: rgba(10, 12, 16, 0.95); border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 20px; padding: 35px; text-align: left; transition: var(--transit); cursor: pointer; }
        .course-card:hover { border-color: var(--neon); box-shadow: 0 15px 40px var(--neon-glow); transform: translateY(-8px); }
        
        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; text-transform: uppercase; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }

        /* Status Overlay (Ваши фирменные окна) */
        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: var(--card-bg); border: 2px solid var(--neon); border-radius: 20px; padding: 40px; text-align: center; max-width: 450px; width: 90%; }
        .loader { width: 45px; height: 45px; border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; margin: 20px 0; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* SBP Styles */
        .bank-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .bank-item { padding: 15px; border: 1px solid #333; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .bank-item:hover { border-color: var(--neon); background: rgba(0,119,255,0.1); }
        #qr-container img { margin-top: 20px; border: 5px solid white; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="status-overlay">
        <div class="status-card">
            <div id="status-text" style="font-family: 'Consolas', monospace; font-size: 18px;"></div>
            <div id="status-loader" class="loader"></div>
            <div id="status-extra"></div>
            <button id="status-close" class="btn" style="display:none; margin-top:25px; padding: 10px 20px;" onclick="hideStatus(0)">ЗАКРЫТЬ</button>
        </div>
    </div>
    <div id="content"></div>
<script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzFIi_kNeOM3GByJ8hsTKRtTelHn28JgiKI6KE0CZ-JSewCD94rKvlF0-smt35MPutN9Q/exec';
    const QR_IMAGE_URL = "http://qrcoder.ru/code/?https%3A%2F%2Fencrypted-tbn0.gstatic.com%2Fimages%3Fq%3Dtbn%3AANd9GcQ3wCvdNY1pPJicrDV0nbeeTBr-5bksabuzKQ%26s&4&0";

    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
        document.getElementById('status-extra').innerHTML = '';
    }

    function hideStatus(delay = 0) {
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay);
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        url.searchParams.forEach((v, k) => url.searchParams.delete(k));
        if (page !== 'home') { 
            url.searchParams.set('page', page); 
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key])); 
        }
        window.history.pushState({}, '', url);
        render();
    };

    window.selectBank = function(bankName) {
        const extra = document.getElementById('status-extra');
        extra.innerHTML = `
            <p style="color: var(--neon); margin-top:15px;">Оплата через ${bankName}</p>
            <div id="qr-container">
                <img src="${QR_IMAGE_URL}" width="196" height="196" alt="QR-код">
                <p style="font-size: 12px; color: #888; margin-top: 10px;">Сканируйте QR-код в приложении банка</p>
            </div>
            <button class="btn" style="margin-top:15px; width:100%" onclick="processFakePayment()">ПОДТВЕРДИТЬ ОПЛАТУ</button>
        `;
    };

    function processFakePayment() {
        showStatus("ПРОВЕРКА ТРАНЗАКЦИИ...", true, false);
        setTimeout(() => {
            showStatus("ОПЛАТА ПРОШЛА УСПЕШНО!", false, true);
        }, 2000);
    }

    window.openPayment = function(name, price) {
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if(!user) {
            showStatus("ДОСТУП ЗАПРЕЩЕН", false, false);
            document.getElementById('status-extra').innerHTML = `
                <p style="margin-bottom:20px">Для покупки курса необходимо войти в систему.</p>
                <button class="btn" onclick="hideStatus(0); navigate('login')">ВОЙТИ</button>
                <button class="btn" style="border-color:#555; color:#888" onclick="hideStatus(0)">ОТМЕНА</button>`;
            return;
        }
        
        showStatus(`ОПЛАТА: ${name}`, false, false);
        document.getElementById('status-extra').innerHTML = `
            <p style="font-size:20px">${price} ₽</p>
            <p style="font-size:14px; color:#888">Выберите способ:</p>
            <div class="bank-list">
                <div class="bank-item" onclick="selectBank('Сбербанк')">СБЕРБАНК</div>
                <div class="bank-item" onclick="selectBank('Т-Банк')">Т-БАНК</div>
                <div class="bank-item" onclick="selectBank('Альфа-Банк')">АЛЬФА</div>
                <div class="bank-item" onclick="selectBank('ВТБ')">ВТБ</div>
            </div>
            <button class="btn" style="margin-top:20px; border-color:#555; color:#888; width:100%" onclick="hideStatus(0)">ОТМЕНА</button>
        `;
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        const contentDiv = document.getElementById('content');

        const nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('login')">ВОЙТИ</a>`}</div></nav>`;
        const wrap = (content) => `<div class="sub-page">${nav}<div class="animate-page">${content}</div></div>`;

        if (page === 'services') {
            contentDiv.innerHTML = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1>
                <div class="course-grid-3">
                    <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')">
                        <h2>Python Developer Pro</h2>
                        <span style="color:var(--neon); font-size:20px">45 000 ₽</span>
                        <p style="color:#888; font-size:13px">6 месяцев глубокого погружения</p>
                        <button class="btn" style="width:100%; margin-top:15px">КУПИТЬ</button>
                    </div>
                    <!-- Другие карточки... -->
                </div>`);
        } else if (page === 'about') {
            contentDiv.innerHTML = wrap(`<div class="content-box"><h1>О НАС</h1><p>Мы — лучшая студия кода.</p></div>`);
        } else {
            contentDiv.innerHTML = wrap(`<h1>STUDIO РЕКОРД</h1><button class="btn" onclick="navigate('services')">К КУРСАМ</button>`);
        }
    }

    window.onpopstate = render;
    render();
</script>
</body>
</html>
