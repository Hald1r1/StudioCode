<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «Рекорд»</title>
    <!-- Прямое подключение модулей Firebase -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, setDoc, getDoc } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyBYCGK00rBT6tfK0QXpFnFijP_23TfmJi0",
            authDomain: "://firebaseapp.com",
            projectId: "recordstudio-26d22",
            storageBucket: "recordstudio-26d22.firebasestorage.app",
            messagingSenderId: "794238287571",
            appId: "1:794238287571:web:266a02e9cb1999cc0e5e26"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Навигация
        window.navigate = (page) => {
            const url = new URL(window.location);
            page === 'home' ? url.searchParams.delete('page') : url.searchParams.set('page', page);
            window.history.pushState({}, '', url);
            render();
        };

        // Отрисовка
        window.render = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const page = urlParams.get('page');
            const contentDiv = document.getElementById('content');
            const user = JSON.parse(sessionStorage.getItem('currentUser'));
            
            const nav = `<nav><div class="logo">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">Профиль</a>` : `<a onclick="navigate('choice')">Войти</a>`}</div></nav>`;

            let html = "";
            if (page === 'about') html = `<div class="sub-page"><div class="content-box"><h1>О НАС</h1><p>Современная экосистема обучения IT.</p></div></div>`;
            else if (page === 'services') html = `<div class="sub-page"><h1>КУРСЫ</h1><div class="course-card"><h2>Python Developer</h2><p>Django и FastAPI.</p></div><div class="course-card"><h2>AI & Neural Networks</h2><p>Deep Learning.</p></div></div>`;
            else if (page === 'profile') html = `<div class="sub-page"><div class="content-box"><h1>ПРОФИЛЬ</h1><p>Привет, <strong>${user.fio}</strong>!</p><button class="btn" onclick="logout()">ВЫЙТИ</button></div></div>`;
            else if (page === 'login') html = `<div class="sub-page"><div class="form-container"><h2>ВХОД</h2><input type="text" id="logL" placeholder="Логин"><input type="password" id="logP" placeholder="Пароль"><button class="btn" onclick="login()">ВОЙТИ</button></div></div>`;
            else if (page === 'register') html = `<div class="sub-page"><div class="form-container"><h2>РЕГИСТРАЦИЯ</h2><input type="text" id="regF" placeholder="ФИО"><input type="text" id="regL" placeholder="Логин"><input type="email" id="regE" placeholder="Email"><input type="password" id="regP" placeholder="Пароль"><button class="btn" onclick="register()">СОЗДАТЬ</button></div></div>`;
            else if (page === 'choice') html = `<div class="sub-page"><div class="content-box"><h1>ВХОД В СИСТЕМУ</h1><button class="btn" onclick="navigate('login')">ЛОГИН</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div></div>`;
            else if (page === 'contacts') html = `<div class="sub-page"><div class="content-box"><h1>КОНТАКТЫ</h1><p>TG: @HaLdjr</p></div></div>`;
            else html = `<div class="sub-page"><div class="content-box"><h1>CODE STUDIO «РЕКОРД»</h1><p>Твой путь в IT.</p><button class="btn" onclick="navigate('choice')">ВОЙТИ В СИСТЕМУ</button></div></div>`;
            
            contentDiv.innerHTML = nav + html;
        };

        window.register = async () => {
            const f = document.getElementById('regF').value, l = document.getElementById('regL').value, e = document.getElementById('regE').value, p = document.getElementById('regP').value;
            if(!f || !l || !p) return alert("Заполни поля!");
            try {
                await setDoc(doc(db, "users", l), { fio: f, login: l, email: e, pass: p });
                alert("Успешно!"); navigate('login');
            } catch (err) { alert("Ошибка записи!"); }
        };

        window.login = async () => {
            const l = document.getElementById('logL').value, p = document.getElementById('logP').value;
            try {
                const d = await getDoc(doc(db, "users", l));
                if (d.exists() && d.data().pass === p) {
                    sessionStorage.setItem('currentUser', JSON.stringify(d.data()));
                    navigate('profile');
                } else alert("Неверные данные!");
            } catch (err) { alert("Ошибка входа."); }
        };

        window.logout = () => { sessionStorage.removeItem('currentUser'); navigate('home'); };
        window.onpopstate = render;
        render();
    </script>
    <style>
        :root { --neon: #00f2ff; --bg: #0d1117; --card-bg: rgba(22, 27, 34, 0.85); }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: sans-serif; background-color: var(--bg); color: #e6edf3; }
        nav { position: fixed; top: 0; width: 100%; background: #161b22; padding: 15px 0; border-bottom: 2px solid var(--neon); display: flex; justify-content: center; gap: 20px; z-index: 100; }
        nav a, .logo { color: var(--neon); text-decoration: none; font-weight: bold; cursor: pointer; }
        .sub-page { padding-top: 120px; display: flex; flex-direction: column; align-items: center; text-align: center; min-height: 100vh; background: linear-gradient(rgba(13,17,23,0.8), rgba(13,17,23,0.8)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; }
        .content-box, .form-container { background: var(--card-bg); padding: 40px; border-radius: 15px; border: 1px solid var(--neon); max-width: 500px; }
        .course-card { background: rgba(255,255,255,0.05); border: 1px solid var(--neon); padding: 20px; margin: 10px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        .btn { background: var(--neon); color: black; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; border: none; margin: 5px; }
    </style>
</head>
<body>
    <div id="content"></div>
</body>
</html>
