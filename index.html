<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        /* Навигация */
        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        /* Анимации */
        @keyframes pageIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1200px; }

        .sub-page { padding: 140px 20px 80px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        /* Карточки и боксы */
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.2); width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5); text-align: left; }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 3px; color: var(--neon); margin-bottom: 20px; font-size: 36px; text-align: center; }
        h3 { color: var(--neon); margin-top: 25px; border-left: 3px solid var(--neon); padding-left: 15px; }
        p { line-height: 1.7; color: #ccc; font-size: 17px; }

        /* Сетка курсов */
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; margin-top: 30px; }
        .course-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 20px; padding: 30px; transition: var(--transit); cursor: pointer; position: relative; overflow: hidden; }
        .course-card:hover { border-color: var(--neon); transform: translateY(-5px); background: rgba(0, 119, 255, 0.05); }
        .course-card h2 { color: #fff; margin: 0; font-size: 22px; }
        .price { color: var(--neon); font-size: 20px; font-weight: bold; margin: 15px 0; }
        .syllabus { font-size: 14px; color: #888; list-style: none; padding: 0; }
        .syllabus li::before { content: "▹ "; color: var(--neon); }

        /* Кнопки */
        .btn { background: transparent; color: var(--neon); padding: 14px 30px; border: 2px solid var(--neon); border-radius: 8px; font-weight: bold; transition: var(--transit); cursor: pointer; text-transform: uppercase; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--neon); }

        /* Окна (Оверлеи) */
        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: #0a0c10; border: 2px solid var(--neon); border-radius: 20px; padding: 40px; text-align: center; width: 400px; }
        .loader { width: 40px; height: 40px; border: 3px solid #111; border-top: 3px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; margin: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Формы */
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; }
        .bank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .bank-btn { padding: 15px; border: 1px solid #333; border-radius: 10px; color: #fff; text-decoration: none; text-align: center; transition: 0.3s; }
        .bank-btn:hover { border-color: var(--neon); color: var(--neon); }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="status-card">
        <div id="status-text" style="font-family: monospace; font-size: 18px;"></div>
        <div id="status-loader" class="loader"></div>
        <button id="status-close" class="btn" style="display:none; margin-top:20px" onclick="hideStatus()">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="content"></div>

<script>
    const SHEET_URL = 'YOUR_URL_HERE';

    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
    }

    function hideStatus() { document.getElementById('status-overlay').style.display = 'none'; }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        url.searchParams.forEach((v, k) => url.searchParams.delete(k));
        url.searchParams.set('page', page);
        Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    function render() {
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page') || 'home';
        const contentDiv = document.getElementById('content');
        
        let nav = `<nav>
            <div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div>
            <div class="nav-links">
                <a onclick="navigate('home')">Главная</a>
                <a onclick="navigate('about')">О студии</a>
                <a onclick="navigate('services')">Курсы</a>
                <a onclick="navigate('contacts')">Контакты</a>
            </div>
            <div class="nav-auth"><a onclick="navigate('login')">ЛИЧНЫЙ КАБИНЕТ</a></div>
        </nav>`;

        let pc = "";
        const wrap = (html) => `<div class="sub-page"><div class="animate-page">${html}</div></div>`;

        if (page === 'home') {
            pc = wrap(`
                <h1 style="font-size: 50px">RECORD CODE STUDIO</h1>
                <p style="text-align:center; max-width: 700px; margin-bottom: 40px;">Мы готовим элиту IT-индустрии. Наша миссия — превратить новичка в архитектора сложных систем через глубокое понимание технологий.</p>
                <div class="course-grid" style="grid-template-columns: repeat(3, 1fr)">
                    <div class="content-box"><h3>85% Практики</h3><p>Минимум скучных лекций, максимум живого кода.</p></div>
                    <div class="content-box"><h3>Топ Наставники</h3><p>Senior-разработчики из Яндекса, Тинькофф и Google.</p></div>
                    <div class="content-box"><h3>Трудоустройство</h3><p>Помогаем составить оффер мечты в BigTech.</p></div>
                </div>
                <button class="btn" style="margin-top: 50px" onclick="navigate('services')">Начать обучение</button>
            `);
        } 
        else if (page === 'about') {
            pc = wrap(`
                <div class="content-box">
                    <h1>О НАС</h1>
                    <p>Code Studio «РЕКОРД» основана в 2018 году как закрытое сообщество разработчиков. Сегодня — это экосистема, включающая образовательный центр и лабораторию разработки ПО.</p>
                    <h3>Наша методология</h3>
                    <p>Мы используем "Метод Проектов": вы не просто учите циклы Python, вы строите торгового бота. Вы не просто учите SQL, вы проектируете архитектуру базы данных для социальной сети.</p>
                    <h3>Цифры</h3>
                    <p>• 1500+ Выпускников<br>• 12 Действующих курсов<br>• 450к ₽ — средняя зарплата наших Senior-выпускников</p>
                </div>
            `);
        }
        else if (page === 'services') {
            pc = wrap(`
                <h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1>
                <div class="course-grid">
                    <div class="course-card" onclick="navigate('order', {item: 'Python Pro', price: '45000'})">
                        <h2>Python Developer Pro</h2>
                        <div class="price">45 000 ₽</div>
                        <ul class="syllabus">
                            <li>Django 4.2 & FastAPI</li>
                            <li>PostgreSQL & Redis</li>
                            <li>Docker & CI/CD</li>
                        </ul>
                    </div>
                    <div class="course-card" onclick="navigate('order', {item: 'AI Engineer', price: '65000'})">
                        <h2>AI Engineer & Data Science</h2>
                        <div class="price">65 000 ₽</div>
                        <ul class="syllabus">
                            <li>Deep Learning (PyTorch)</li>
                            <li>NLP & Transformers</li>
                            <li>Computer Vision</li>
                        </ul>
                    </div>
                    <div class="course-card" onclick="navigate('order', {item: 'CyberSec', price: '80000'})">
                        <h2>Cyber Security Expert</h2>
                        <div class="price">80 000 ₽</div>
                        <ul class="syllabus">
                            <li>Ethical Hacking</li>
                            <li>Reverse Engineering</li>
                            <li>Network Defense</li>
                        </ul>
                    </div>
                </div>
            `);
        }
        else if (page === 'contacts') {
            pc = wrap(`
                <div class="content-box" style="max-width: 800px">
                    <h1>КОНТАКТЫ</h1>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px">
                        <div>
                            <h3>Связь с нами</h3>
                            <p>📍 Москва, БЦ "Сити", Башня Федерация</p>
                            <p>📞 +7 (495) 000-00-00</p>
                            <p>📧 edu@record-code.ru</p>
                            <p>🕗 ПН-ПТ: 10:00 - 20:00</p>
                        </div>
                        <div>
                            <h3>Напишите нам</h3>
                            <input placeholder="Ваше имя">
                            <input placeholder="Email">
                            <textarea placeholder="Ваш вопрос" rows="4"></textarea>
                            <button class="btn" style="width:100%" onclick="showStatus('Сообщение отправлено!', false, true)">ОТПРАВИТЬ</button>
                        </div>
                    </div>
                </div>
            `);
        }
        else if (page === 'order') {
            const item = params.get('item'), price = params.get('price');
            pc = wrap(`
                <div class="content-box" style="max-width: 500px; text-align: center">
                    <h1>ОПЛАТА</h1>
                    <p style="color:var(--neon)">${item}</p>
                    <p style="font-size: 24px">${price} ₽</p>
                    <div id="p-choice">
                        <button class="btn" style="width:100%; margin-bottom:10px" onclick="document.getElementById('card-f').style.display='block'; document.getElementById('p-choice').style.display='none'">БАНКОВСКАЯ КАРТА</button>
                        <button class="btn" style="width:100%" onclick="document.getElementById('sbp-f').style.display='block'; document.getElementById('p-choice').style.display='none'">СБП / БАНК-КЛИЕНТ</button>
                    </div>
                    <div id="card-f" style="display:none">
                        <input placeholder="0000 0000 0000 0000">
                        <div style="display:flex; gap:10px"><input placeholder="ММ/ГГ"><input placeholder="CVC"></div>
                        <button class="btn" style="width:100%; margin-top:20px" onclick="showStatus('Платеж обрабатывается...'); setTimeout(()=>showStatus('Успешно оплачено!', false, true), 2000)">ОПЛАТИТЬ</button>
                    </div>
                    <div id="sbp-f" style="display:none">
                        <div class="bank-grid">
                            <a href="#" class="bank-btn">СБЕРБАНК</a>
                            <a href="#" class="bank-btn">Т-БАНК</a>
                        </div>
                    </div>
                </div>
            `);
        }

        contentDiv.innerHTML = nav + pc;
    }

    window.onpopstate = render;
    render();
</script>
</body>
</html>
