<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        /* Навигация */
        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        @keyframes pageIn { 
            from { opacity: 0; transform: translateY(8px); filter: blur(2px); } 
            to { opacity: 1; transform: translateY(0); filter: blur(0); } 
        }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }

        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.85), rgba(5, 7, 10, 0.85)); background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.3); width: 100%; max-width: 900px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); margin-bottom: 25px; font-size: 32px; }

        .course-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 850px; margin-top: 30px; }
        .course-card { background: var(--card-bg); border: 1px solid rgba(0, 119, 255, 0.4); border-radius: 15px; padding: 35px; text-align: left; transition: var(--transit); cursor: pointer; }
        .course-card:hover { border-color: var(--neon); box-shadow: 0 10px 30px var(--neon-glow); }
        .course-card h2 { color: var(--neon); margin: 0; font-size: 26px; }
        .course-card .price { font-weight: bold; color: #ffffff; margin: 10px 0; font-size: 19px; letter-spacing: 1px; }
        .course-card .info { font-size: 17px; color: #f0f0f0; line-height: 1.6; border-top: 1px solid rgba(0,119,255,0.1); padding-top: 15px; }

        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); transform: scale(1.02); }

        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #555; color: white; border-radius: 8px; font-size: 16px; transition: 0.2s; }
        input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 10px var(--neon-glow); }

        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: var(--card-bg); border: 2px solid var(--neon); border-radius: 20px; padding: 40px 50px; text-align: center; box-shadow: 0 0 50px var(--neon-glow); max-width: 90%; animation: pageIn 0.3s ease-out; }
        .loader { margin-top: 25px; width: 45px; height: 45px; border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .bank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; width: 100%; }
        .bank-btn { padding: 20px; border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 12px; cursor: pointer; transition: 0.3s; background: #0a0c10; font-weight: bold; text-decoration: none; color: #fff; display: block; text-align: center; }
        .bank-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="status-card">
        <div id="status-text"></div>
        <div id="status-loader" class="loader"></div>
        <button id="status-close" class="btn" style="display:none; margin-top:25px; padding: 10px 30px; font-size: 13px;" onclick="hideStatus(0)">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="content"></div>

<script>
    const SHEET_URL = 'https://google.com';

    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
    }

    function hideStatus(delay = 400) {
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay);
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        if (page === 'home') {
            const keys = Array.from(url.searchParams.keys());
            keys.forEach(k => url.searchParams.delete(k));
        } else {
            url.searchParams.set('page', page);
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    window.openPayment = function(name, price) {
        navigate('order', { item: name, price: price });
    };

    window.processPayment = function() {
        showStatus("Обработка транзакции...");
        setTimeout(() => {
            showStatus("Оплата прошла успешно!", false, true);
        }, 2000);
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || 'home';
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        let nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}</div></nav>`;
        
        let pageContent = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        switch(page) {
            case 'home':
                pageContent = wrap(`<h1>Code Studio «РЕКОРД»</h1><p style="font-size:20px">Твой пропуск в мир высоких технологий</p><button class="btn" onclick="navigate('services')">Смотреть курсы</button>`);
                break;
            case 'order':
                const item = urlParams.get('item'), price = urlParams.get('price');
                pageContent = wrap(`
                    <div class="content-box" style="max-width: 650px">
                        <h1>ОФОРМЛЕНИЕ</h1>
                        <p style="font-size: 22px; color: var(--neon); font-weight: bold;">${item}</p>
                        <p style="font-size: 26px; border-bottom: 1px solid #333; padding-bottom: 20px;">Сумма: ${price} ₽</p>
                        <div id="pay-scr">
                            <p>ВЫБЕРИТЕ МЕТОД ОПЛАТЫ:</p>
                            <div style="display:flex; gap:20px; margin-top:20px">
                                <button class="btn" style="flex:1" onclick="document.getElementById('card-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">💳 КАРТА</button>
                                <button class="btn" style="flex:1" onclick="document.getElementById('sbp-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">📲 СБП</button>
                            </div>
                        </div>
                        <div id="card-scr" style="display:none">
                            <input type="text" id="card_number" placeholder="Номер карты" maxlength="19" oninput="this.value = this.value.replace(/\\D/g,'').replace(/(.{4})/g, '$1 ').trim()">
                            <div style="display:flex; gap:10px">
                                <input type="text" id="card_date" placeholder="ММ / ГГ" style="flex:1" maxlength="7" oninput="this.value = this.value.replace(/\\D/g,'').replace(/^(\\d{2})(\\d)/, '$1 / $2').substring(0, 7)">
                                <input type="text" id="card_cvc" placeholder="CVC" style="flex:1" maxlength="3" oninput="this.value = this.value.replace(/\\D/g,'')">
                            </div>
                            <button class="btn" style="width:100%; margin-top:20px" onclick="processPayment()">ОПЛАТИТЬ</button>
                        </div>
                        <div id="sbp-scr" style="display:none">
                            <div class="bank-grid">
                                <a href="https://sberbank.ru" target="_blank" class="bank-btn">СБЕРБАНК</a>
                                <a href="https://tbank.ru" target="_blank" class="bank-btn">Т-БАНК</a>
                            </div>
                        </div>
                    </div>`);
                break;
            case 'services':
                pageContent = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1><div class="course-grid">
                    <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')"><h2>Python Developer Pro</h2><div class="price">45 000 ₽</div><div class="info">Бэкенд-разработка на Django и FastAPI.</div></div>
                    <div class="course-card" onclick="openPayment('Neural Networks & AI', '65 000')"><h2>Neural Networks & AI</h2><div class="price">65 000 ₽</div><div class="info">Обучение современных LLM и Computer Vision.</div></div>
                </div>`);
                break;
            case 'about':
                pageContent = wrap(`<div class="content-box"><h1>О СТУДИИ</h1><p>Инновационная платформа для подготовки инженеров.</p></div>`);
                break;
            case 'choice':
                pageContent = wrap(`<div class="content-box" style="max-width:400px"><h1>ВХОД</h1><input placeholder="Логин"><input type="password" placeholder="Пароль"><button class="btn" style="width:100%">ВОЙТИ</button></div>`);
                break;
            default:
                pageContent = wrap(`<h1>404</h1><p>Страница не найдена</p>`);
        }
        
        contentDiv.innerHTML = nav + pageContent;
    }

    window.onpopstate = render;
    render();
</script>
</body>
</html>
