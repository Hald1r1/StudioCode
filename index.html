<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД»</title>
    <link rel="icon" href="image.png" type="image/png">

    <!-- ==========================================
         ВНЕШНИЙ ВИД (ПОЛНЫЙ CSS)
         ========================================== -->
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        /* Навигация */
        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        /* Анимации и Общие блоки */
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }

        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.85), rgba(5, 7, 10, 0.85)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.3); width: 100%; max-width: 1200px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); backdrop-filter: blur(10px); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); margin-bottom: 25px; font-size: 32px; }

        /* Статистика */
        .info-stats { display: flex; justify-content: center; align-items: stretch; gap: 20px; margin: 30px auto; width: 100%; max-width: 1000px; flex-wrap: wrap; }
        .stat-square { background: rgba(0, 119, 255, 0.05); border: 1px solid rgba(0, 119, 255, 0.2); padding: 25px; border-radius: 15px; flex: 0 1 210px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.3s; }
        .stat-square:hover { border-color: var(--neon); box-shadow: 0 0 20px var(--neon-glow); }
        .stat-square span { display: block; color: var(--neon); font-size: 26px; font-weight: bold; font-family: 'Consolas', monospace; text-shadow: 0 0 10px var(--neon-glow); }
        .stat-square p { margin: 8px 0 0; font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

        /* Дорожная карта */
        .roadmap { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 40px 0; width: 100%; flex-wrap: wrap; }
        .step { background: rgba(255,255,255,0.03); border: 1px solid #333; padding: 12px 25px; border-radius: 50px; font-size: 12px; font-weight: bold; color: #ccc; text-transform: uppercase; }
        .arrow { color: var(--neon); font-size: 20px; }

        /* Сетка курсов */
        .course-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; width: 100%; margin-top: 30px; }
        .course-card { background: rgba(10, 12, 16, 0.95); border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 20px; padding: 35px; text-align: left; transition: var(--transit); cursor: pointer; display: flex; flex-direction: column; }
        .course-card:hover { border-color: var(--neon); box-shadow: 0 15px 40px var(--neon-glow); transform: translateY(-8px); }
        .course-card h2 { color: var(--neon); font-size: 24px; margin: 0 0 12px; border-bottom: 1px solid rgba(0,119,255,0.2); padding-bottom: 10px; }
        .course-card .price { font-weight: bold; color: #fff; font-size: 20px; margin-bottom: 15px; display: block; }
        .course-card .details { font-size: 13px; line-height: 1.6; color: #bbb; flex-grow: 1; }
        .course-card .details b { color: var(--neon); display: block; margin-top: 10px; }

        /* Кнопки и Формы */
        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; outline: none; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }

        .form-container { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--neon); width: 100%; max-width: 450px; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #555; color: white; border-radius: 8px; font-size: 16px; transition: 0.2s; font-family: inherit; }
        input:focus { border-color: var(--neon); outline: none; }

        .form-footer { margin-top: 20px; font-size: 13px; color: #8b949e; }
        .form-footer a { color: var(--neon); text-decoration: none; font-weight: bold; cursor: pointer; }

        /* Статус-оверлей */
        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: var(--card-bg); border: 2px solid var(--neon); border-radius: 20px; padding: 40px 50px; text-align: center; box-shadow: 0 0 50px var(--neon-glow); max-width: 90%; }
        .loader { margin-top: 25px; width: 45px; height: 45px; border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Подсказка пароля */
        .pass-hint { color: #ff4444; font-size: 11px; text-align: left; margin: -5px 0 10px 5px; display: none; }
    </style>
</head>
<body>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="status-overlay">
    <div class="status-card">
        <div id="status-text"></div>
        <div id="status-loader" class="loader"></div>
        <div id="status-extra" style="margin-top: 20px;"></div>
        <button id="status-close" class="btn" style="display:none; margin-top:25px; padding: 10px 30px; font-size: 13px;" onclick="hideStatus(0)">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="content"></div>

<script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzFIi_kNeOM3GByJ8hsTKRtTelHn28JgiKI6KE0CZ-JSewCD94rKvlF0-smt35MPutN9Q/exec';
    let generatedCode = null;

    // ==========================================
    // ЛОГИКА ИНТЕРФЕЙСА
    // ==========================================
    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
        document.getElementById('status-extra').innerHTML = '';
    }

    function hideStatus(delay = 400) {
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay);
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        url.searchParams.forEach((v, k) => url.searchParams.delete(k));
        if (page !== 'home') { url.searchParams.set('page', page); Object.keys(params).forEach(key => url.searchParams.set(key, params[key])); }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    window.openPayment = function(name, price) {
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if(!user) {
            showStatus("НЕОБХОДИМА АВТОРИЗАЦИЯ", false, false);
            document.getElementById('status-extra').innerHTML = `
                <button class="btn" onclick="hideStatus(0); navigate('login')">ВОЙТИ</button>
                <button class="btn" style="border-color:#555; color:#888" onclick="hideStatus(0)">ЗАКРЫТЬ</button>`;
            return;
        }
        navigate('order', {item: name, price: price});
    };

    // ==========================================
    // ОТРЕНДЕРЕННЫЕ СТРАНИЦЫ (RENDER)
    // ==========================================
    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        const nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('login')">ВОЙТИ</a>`}</div></nav>`;
        let pc = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        // --- СТРАНИЦА КУРСОВ ---
        if (page === 'services') {
            pc = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1>
                <div class="course-grid-3">
                    <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')">
                        <h2>Python Developer Pro</h2>
                        <span class="price">45 000 ₽ / 6 мес.</span>
                        <div class="details"><b>МОДУЛИ:</b> • Асинхронный Python<br>• Django, FastAPI, Celery<br>• Docker Compose<br>• SQL: PostgreSQL<br><b>ПРОЕКТ:</b> Соцсеть</div>
                        <button class="btn" style="margin-top:20px; width:100%">ВЫБРАТЬ</button>
                    </div>
                    <div class="course-card" onclick="openPayment('Neural Networks & AI', '65 000')">
                        <h2>Neural Networks & AI</h2>
                        <span class="price">65 000 ₽ / 9 мес.</span>
                        <div class="details"><b>МОДУЛИ:</b> • CV & NLP<br>• Обучение LLM<br>• RL<br><b>ПРОЕКТ:</b> AI-ассистент</div>
                        <button class="btn" style="margin-top:20px; width:100%">ВЫБРАТЬ</button>
                    </div>
                    <div class="course-card" onclick="openPayment('Cyber Security Expert', '80 000')">
                        <h2>Cyber Security Expert</h2>
                        <span class="price">80 000 ₽ / 12 мес.</span>
                        <div class="details"><b>МОДУЛИ:</b> • Реверс-инжиниринг<br>• OWASP<br>• Blockchain<br><b>ПРОЕКТ:</b> Аудит банка</div>
                        <button class="btn" style="margin-top:20px; width:100%">ВЫБРАТЬ</button>
                    </div>
                </div>`);
        
        // --- О НАС ---
        } else if (page === 'about') {
            pc = wrap(`<div class="content-box">
                <h1>О СТУДИИ «РЕКОРД»</h1>
                <p style="color:#aaa; font-size:18px; margin-bottom:40px">Мы не учим хобби. Мы строим профессиональную карьеру.</p>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; width: 100%;">
                    <div style="background: rgba(255,255,255,0.03); border-top: 3px solid var(--neon); padding: 30px; border-radius: 15px; text-align: left;"><h3>80% ПРАКТИКИ</h3><p style="color:#888; font-size:14px">Весь процесс обучения на задачах уровня Middle. Никакой сухой теории - вы сразу погружаетесь в разработку реальных фич и сервисов. Мы моделируем рабочую атмосферу современного IT-департамента, где вы учитесь соблюдать дедлайны и работать в команде</p></div>
                    <div style="background: rgba(255,255,255,0.03); border-top: 3px solid var(--neon); padding: 30px; border-radius: 15px; text-align: left;"><h3>SENIOR МЕНТОРЫ</h3><p style="color:#888; font-size:14px">Ваш код проверяют практики из BigTech. Забудьте о формальных проверках. Вы получите детальный code review от инженеров из Яндекса, Авито или Тинькофф. Мы научим вас писать не просто рабочий, а чистый и масштабируемый код</p></div>
                    <div style="background: rgba(255,255,255,0.03); border-top: 3px solid var(--neon); padding: 30px; border-radius: 15px; text-align: left;"><h3>ЭЛИТНОЕ КОМЬЮНИТИ</h3><p style="color:#888; font-size:14px">Доступ в закрытый чат с инсайдами индустрии. Мы регулярно проводим закрытые митапы и сессии вопросов и ответов с экспертами рынка, помогая вам быть на острие технологий</p></div>
                </div>
            </div>`);

        // --- КОНТАКТЫ ---
        } else if (page === 'contacts') {
            pc = wrap(`<div class="content-box" style="max-width:600px">
                <h1>СВЯЗЬ</h1>
                <p style="font-size: 22px">Telegram: <a href="https://t.me" target="_blank" style="color:var(--neon); text-decoration:none;">@HaLdjr</a></p>
                <div style="border-top:1px solid #333; margin-top:30px; padding-top:20px">
                    <input type="email" placeholder="Email"><textarea placeholder="Ваш вопрос..." rows="4"></textarea>
                    <button class="btn" style="width:100%; margin:10px 0" onclick="showStatus('СООБЩЕНИЕ ОТПРАВЛЕНО!', false, true)">ОТПРАВИТЬ</button>
                </div>
            </div>`);

        // --- РЕГИСТРАЦИЯ ---
        } else if (page === 'register') {
            pc = wrap(`<div class="form-container"><h1>РЕГИСТРАЦИЯ</h1>
                <input type="text" id="rFio" placeholder="Полное ФИО"><input type="text" id="rLog" placeholder="Логин"><input type="email" id="rEma" placeholder="Email"><input type="password" id="rPas" placeholder="Пароль">
                <div id="passHint" class="pass-hint"></div>
                <button class="btn" style="width:100%; margin-left:0" onclick="startRegistration()">ОТПРАВИТЬ КОД</button>
                <div class="form-footer">Уже есть аккаунт? <a onclick="navigate('login')">Войти</a></div>
            </div>`);

        // --- ВХОД ---
        } else if (page === 'login') {
            pc = wrap(`<div class="form-container"><h1>ВХОД</h1>
                <input type="text" id="lLog" placeholder="Ваш логин"><input type="password" id="lPas" placeholder="Пароль">
                <div style="text-align:right; margin:-5px 0 15px;"><a onclick="showStatus('Для восстановления напишите в Telegram: @HaLdjr', false, true)" style="color:var(--neon); cursor:pointer; font-size:12px;">Забыли пароль?</a></div>
                <button class="btn" style="width:100%; margin-left:0" onclick="login()">ВОЙТИ</button>
                <div class="form-footer">Нет аккаунта? <a onclick="navigate('register')">Зарегистрируйтесь</a></div>
            </div>`);

        // --- ЛИЧНЫЙ КАБИНЕТ (УЛУЧШЕННЫЙ) ---
            pc = wrap(`<div class="content-box"><h1>КАБИНЕТ</h1><p>Привет, <span style="color:var(--neon)">${user?.fio}</span>!</p><button class="btn" onclick="logout()">ВЫЙТИ</button></div>`);

        // --- ОФОРМЛЕНИЕ ЗАКАЗА ---
        } else if (page === 'order') {
            const item = urlParams.get('item'), price = urlParams.get('price');
            pc = wrap(`<div class="content-box" style="max-width: 650px">
                <h1>ОФОРМЛЕНИЕ</h1>
                <p style="color: var(--neon); font-weight: bold;">${item}</p>
                <p style="font-size: 26px; border-bottom: 1px solid #222; padding-bottom: 20px;">${price} ₽</p>
                <div id="pay-scr"><div style="display:flex; gap:20px; margin-top:20px"><button class="btn" style="flex:1" onclick="document.getElementById('card-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">💳 КАРТА</button><button class="btn" style="flex:1" onclick="document.getElementById('sbp-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">📲 СБП</button></div></div>
                <div id="card-scr" style="display:none"><input type="text" id="card_number" placeholder="Номер карты" maxlength="19" oninput="this.value = this.value.replace(/\\D/g,'').replace(/(.{4})/g, '$1 ').trim()"><div style="display:flex; gap:10px"><input type="text" id="card_date" placeholder="ММ / ГГ" style="flex:1" maxlength="7" oninput="this.value = this.value.replace(/\\D/g,'').replace(/^(\\d{2})(\\d)/, '$1 / $2').substring(0, 7)"><input type="text" id="card_cvc" placeholder="CVC" style="flex:1" maxlength="3"></div><button class="btn" style="width:100%; margin-top:20px" onclick="processPayment()">ОПЛАТИТЬ</button></div>
                <div id="sbp-scr" style="display:none"><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><button class="btn" onclick="showSbpQr()">СБЕР</button><button class="btn" onclick="showSbpQr()">Т-БАНК</button></div><div id="qr-area" style="display:none; margin-top:30px; text-align:center;"><div style="background: #fff; padding: 15px; border-radius: 15px; display: inline-block; box-shadow: 0 0 20px var(--neon-glow);"><img src="qr.png" width="196" height="196" style="display:block; margin: 0 auto;"><p style="color:#000; font-size:12px; margin-top:10px; font-weight:bold; font-family:sans-serif;">СКАНИРУЙТЕ ДЛЯ ОПЛАТЫ</p></div><button class="btn" style="width:100%; margin-top:20px" onclick="processPayment()">Я ОПЛАТИЛ</button></div></div>
            </div>`);

        // --- ГЛАВНАЯ ---
        } else {
            pc = wrap(`<div class="content-box">
                <h1>CODE STUDIO «РЕКОРД»</h1>
                <p style="font-size: 20px; color:#888;">Твой путь в элиту IT. Практика с первого дня.</p>
                <div class="info-stats">
                    <div class="stat-square"><span>500+</span><p>Студентов</p></div>
                    <div class="stat-square"><span>24/7</span><p>Менторство</p></div>
                    <div class="stat-square"><span>94%</span><p>Офферов</p></div>
                    <div class="stat-square"><span>TOP</span><p>Уровень PRO</p></div>
                </div>
                <div class="roadmap">
                    <div class="step">ОСНОВЫ</div><div class="arrow">➔</div>
                    <div class="step">ХАРД-ПРАКТИКА</div><div class="arrow">➔</div>
                    <div class="step">РЕАЛЬНЫЙ КЕЙС</div><div class="arrow">➔</div>
                    <div class="step">ОФФЕР</div>
                </div>
                <button class="btn" onclick="${user ? 'navigate(\'profile\')' : 'navigate(\'register\')'}">${user ? 'В ЛИЧНЫЙ КАБИНЕТ' : 'ВСТУПИТЬ В СООБЩЕСТВО'}</button>
            </div>`);
        }
        contentDiv.innerHTML = nav + pc;
    }

    // ==========================================
    // СКРИПТЫ ФУНКЦИОНАЛА
    // ==========================================
    window.showSbpQr = () => document.getElementById('qr-area').style.display = 'block';

    window.startRegistration = function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        const hint = document.getElementById('passHint');
        if(!f || !l || !e || !p) return showStatus("ЗАПОЛНИТЕ ВСЕ ПОЛЯ!", false, true);

        // ВАЛИДАЦИЯ ПАРОЛЯ
        let errors = [];
        if (p.length < 8) errors.push("8+ символов");
        if (!/[A-Z]/.test(p)) errors.push("ЗАГЛАВНАЯ буква");
        if (!/[a-z]/.test(p)) errors.push("строчная буква");
        if (!/[0-9]/.test(p)) errors.push("цифра");
        if (!/[!@#$%^&*]/.test(p)) errors.push("спецсимвол (!@#...)");

        if(errors.length > 0) {
            hint.style.display = 'block';
            hint.innerText = "Ошибка: " + errors.join(", ");
            return;
        } else { hint.style.display = 'none'; }

        generatedCode = Math.floor(100000 + Math.random() * 900000);
        showStatus("ОТПРАВКА КОДА...");
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?method=sendCode&email=${encodeURIComponent(e)}&code=${generatedCode}&callback=codeSent`;
        document.body.appendChild(s);
        window.regTemp = {f, l, e, p};
    };

    window.codeSent = () => {
        showStatus("КОД ОТПРАВЛЕН", false);
        document.getElementById('status-extra').innerHTML = `<input type="text" id="vCode" placeholder="000000" style="text-align:center; width:200px; font-size:20px; letter-spacing:3px; margin:10px auto; display:block"><button class="btn" onclick="verifyAndReg()">ПОДТВЕРДИТЬ</button>`;
    };

    window.verifyAndReg = () => {
        if(document.getElementById('vCode').value == generatedCode) {
            showStatus("СОЗДАНИЕ АККАУНТА...");
            const {f, l, e, p} = window.regTemp;
            const s = document.createElement('script');
            s.src = `${SHEET_URL}?method=register&fio=${encodeURIComponent(f)}&login=${encodeURIComponent(l)}&ema=${encodeURIComponent(e)}&pass=${encodeURIComponent(p)}&callback=regOk`;
            document.body.appendChild(s);
        } else { showStatus("НЕВЕРНЫЙ КОД!", false, true); }
    };

    window.regOk = () => { showStatus("ГОТОВО!", false); setTimeout(() => { hideStatus(); navigate('login'); }, 1500); };

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        if(!l || !p) return showStatus("ВВЕДИТЕ ДАННЫЕ!", false, true);
        showStatus("ПРОВЕРКА...");
        window.tempL = l; window.tempP = p;
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?callback=logOk`;
        document.body.appendChild(s);
    };

    window.logOk = (users) => {
        const u = users.find(x => String(x.login) === window.tempL && String(x.pass) === window.tempP);
        if(u) { sessionStorage.setItem('currentUser', JSON.stringify(u)); showStatus("УСПЕШНО!", false); setTimeout(() => { hideStatus(); navigate('profile'); }, 1000); }
        else { showStatus("ОШИБКА ДАННЫХ", false, true); }
    };

    window.processPayment = () => { showStatus("ОБРАБОТКА..."); setTimeout(() => { showStatus("ОПЛАЧЕНО!", false); setTimeout(() => { hideStatus(); navigate('profile'); }, 2000); }, 1500); };
    window.logout = () => { sessionStorage.removeItem('currentUser'); navigate('home'); };
    window.onpopstate = render;
    render();
</script>
</body>
</html>
