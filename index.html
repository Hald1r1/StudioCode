<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <link rel="icon" href="image.png" type="image/png">
    <style>
        :root {
            --neon: #0077ff; --neon-glow: rgba(0, 119, 255, 0.4); --bg: #05070a;
            --card-bg: #0a0c10; --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; scroll-behavior: smooth; }
        
        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }
        @media (min-width: 768px) { nav { flex-direction: row; justify-content: center; padding: 20px 0; } .logo { position: absolute; left: 40px; } .nav-links { margin-top: 0; gap: 40px; } .nav-auth { position: absolute; right: 40px; margin-top: 0; } }

        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }

        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.9), rgba(5, 7, 10, 0.9)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.2); width: 100%; max-width: 1000px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); margin-bottom: 30px; }
        
        /* СТИЛЬ КАРТОЧКИ КАК НА СКРИНШОТЕ */
        .form-container { 
            background: #0a0c10; 
            padding: 50px 40px; 
            border-radius: 25px; 
            border: 1px solid #1c2b42; 
            width: 100%; 
            max-width: 440px; 
            box-shadow: 0 0 40px rgba(0, 119, 255, 0.15);
        }
        .form-container h1 { 
            color: #0088ff; 
            font-family: 'Segoe UI', sans-serif; 
            font-weight: 800; 
            letter-spacing: 4px; 
            font-size: 28px; 
            margin-bottom: 35px;
            text-shadow: none;
        }
        .form-container input { 
            width: 100%; 
            padding: 16px 20px; 
            margin-bottom: 15px; 
            background: #eef5ff; 
            border: none; 
            color: #000; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 500;
        }
        .form-container input[type="password"] {
            background: #000;
            color: #fff;
            border: 1px solid #222;
        }
        .form-container .btn { 
            background: transparent; 
            color: #0077ff; 
            border: 2px solid #0077ff; 
            padding: 12px 30px; 
            font-size: 12px; 
            border-radius: 8px; 
            margin-top: 10px;
            letter-spacing: 2px;
        }
        .form-container .btn:hover { background: #0077ff; color: #000; box-shadow: 0 0 20px var(--neon); }

        /* Остальной контент */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 40px 0; }
        .stat-card { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 15px; border: 1px solid rgba(0,119,255,0.1); }
        .stat-num { font-size: 32px; font-weight: bold; color: var(--neon); display: block; }
        .stat-txt { font-size: 13px; color: #8b949e; text-transform: uppercase; }

        .course-grid { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 900px; }
        .course-card { background: var(--card-bg); border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 20px; padding: 40px; text-align: left; transition: var(--transit); cursor: pointer; }
        .course-card:hover { border-color: var(--neon); box-shadow: 0 15px 40px var(--neon-glow); transform: translateY(-3px); }
        .course-card h3 { color: var(--neon); font-size: 26px; margin: 0; }
        .course-card .price { font-weight: bold; color: #ffffff; font-size: 22px; margin: 10px 0 20px; display: block; }

        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: #0a0c10; border: 2px solid var(--neon); border-radius: 20px; padding: 40px 50px; text-align: center; box-shadow: 0 0 50px var(--neon-glow); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="status-overlay"><div class="status-card"><div id="status-text" style="font-family:Consolas; font-size:16px; text-transform:uppercase;"></div><div id="status-loader" style="margin-top:20px;"><div style="width:40px; height:40px; border:4px solid #111; border-top:4px solid var(--neon); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block;"></div></div><button id="status-close" class="btn" style="display:none; margin-top:25px; border:1px solid #555; color:#555;" onclick="document.getElementById('status-overlay').style.display='none'">ЗАКРЫТЬ</button></div></div>
<div id="content"></div>
<script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwP9AX2NA6AuGhxyZFD-OVSvPnEb1WDsmvBBWEtoT0lu81JEDvq50mnLYuxfa05la-QEw/exec';

    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
    }

    function hideStatus(delay = 400) { 
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay); 
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        if (page === 'home') Array.from(url.searchParams.keys()).forEach(k => url.searchParams.delete(k));
        else { url.searchParams.set('page', page); Object.keys(params).forEach(key => url.searchParams.set(key, params[key])); }
        window.history.pushState({}, '', url); render(); window.scrollTo(0,0);
    };

    // Проверка входа перед переходом к оплате
    window.checkAccess = function(name, price) {
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if(!user) {
            showStatus("ДЛЯ ПРОДОЛЖЕНИЯ НЕОБХОДИМО ВОЙТИ В АККАУНТ", false, true);
            setTimeout(() => { hideStatus(); navigate('choice'); }, 2000);
        } else {
            window.open(`${window.location.origin}${window.location.pathname}?page=order&item=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}`, '_blank');
        }
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search), page = urlParams.get('page'), contentDiv = document.getElementById('content'), user = JSON.parse(sessionStorage.getItem('currentUser'));
        const nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}</div></nav>`;
        let pc = ""; const wrap = (c) => `<div class="sub-page"><div class="animate-page">${c}</div></div>`;

        if (page === 'about') {
            pc = wrap(`<div class="content-box"><h1>О СТУДИИ «РЕКОРД»</h1><p style="line-height:1.8; font-size: 19px; text-align: justify; color: #ffffff;">Code Studio «РЕКОРД» — это инновационная образовательная платформа, созданная для подготовки специалистов мирового уровня. Мы не просто учим писать код, мы формируем инженерное мышление. <br><br>Наши программы разработаны совместно с ведущими архитекторами из BigTech компаний. Мы используем метод полного погружения: 20% теории и 80% интенсивной практики на реальных кейсах. Мы убрали скучные лекции, оставив только суровую практику, которая встречается в реальных проектах уровня Яндекса или Google.</p><h2>Почему мы?</h2><div style="text-align:left; margin-top:20px;"><p>✅ <b>Менторство:</b> Личный наставник из индустрии.<br>✅ <b>Карьерный лифт:</b> Помощь с резюме и рекомендации в компании-партнеры.</p></div></div>`);
        } 
        else if (page === 'services') {
            pc = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1><div class="course-grid">
                    <div class="course-card" onclick="checkAccess('Python Developer Pro', '45 000')"><h3>Python Developer Pro</h3><span class="price">45 000 ₽ | 6 месяцев</span><ul><li>Django 4, FastAPI, REST API.</li><li>PostgreSQL, Redis, Docker.</li></ul></div>
                    <div class="course-card" onclick="checkAccess('Neural Networks & AI', '65 000')"><h3>Neural Networks & AI</h3><span class="price">65 000 ₽ | 9 месяцев</span><ul><li>Статистика и обучение LLM.</li><li>PyTorch, OpenCV, NLP.</li></ul></div>
                    <div class="course-card" onclick="checkAccess('Cyber Security Expert', '80 000')"><h3>Cyber Security Expert</h3><span class="price">80 000 ₽ | 12 месяцев</span><ul><li>Этичный хакинг и аудит.</li><li>Kali Linux, Pentest, OWASP.</li></ul></div>
                </div>`);
        }
        else if (page === 'register') {
            pc = wrap(`<div class="form-container"><h1>РЕГИСТРАЦИЯ</h1><input type="text" id="rFio" placeholder="ФИО"><input type="text" id="rLog" placeholder="Логин"><input type="email" id="rEma" placeholder="Email"><input type="password" id="rPas" placeholder="••••••••"><button class="btn" onclick="register()">СОЗДАТЬ</button></div>`);
        } 
        else if (page === 'login') {
            pc = wrap(`<div class="form-container"><h1>ВХОД</h1><input type="text" id="lLog" placeholder="Логин"><input type="password" id="lPas" placeholder="••••••••"><button class="btn" onclick="login()">ВОЙТИ</button></div>`);
        }
        else if (page === 'order') {
            const item = urlParams.get('item'), price = urlParams.get('price');
            pc = wrap(`<div class="content-box" style="max-width: 650px"><h1>ОФОРМЛЕНИЕ</h1><p style="font-size: 22px; color: var(--neon); font-weight: bold;">${item}</p><p style="font-size: 26px; border-bottom: 1px solid #333; padding-bottom: 20px;">К оплате: ${price} ₽</p><div id="pay-scr"><div style="display:flex; gap:20px; margin-top:20px"><button class="btn" style="flex:1" onclick="document.getElementById('card-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">💳 КАРТА</button><button class="btn" style="flex:1" onclick="document.getElementById('sbp-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">📲 СБП</button></div></div>
                <div id="card-scr" style="display:none"><p>ДАННЫЕ КАРТЫ:</p><input style="background:#fff; color:#000" type="text" id="cn" placeholder="Номер карты" maxlength="19" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g, '$1 ').trim()"><div style="display:flex; gap:10px"><input style="background:#fff; color:#000" type="text" id="cd" placeholder="ММ / ГГ" maxlength="7" oninput="this.value=this.value.replace(/\\D/g,'').replace(/^(\\d{2})(\\d)/, '$1 / $2').substring(0, 7)"><input style="background:#fff; color:#000" type="text" id="cv" placeholder="CVC" maxlength="3"></div><button class="btn" style="width:100%; margin-top:20px" onclick="if(cn.value.length<19)return; showStatus('ОБРАБОТКА...'); setTimeout(()=>{showStatus('УСПЕШНО ОПЛАЧЕНО!', false); setTimeout(()=>window.close(), 2000)}, 1500)">ОПЛАТИТЬ</button><button class="btn" style="width:100%; border-color:#555; color:#555;" onclick="document.getElementById('pay-scr').style.display='block'; document.getElementById('card-scr').style.display='none'">НАЗАД</button></div>
                <div id="sbp-scr" style="display:none"><div class="bank-grid"><a href="https://sberbank.ru" target="_blank" class="bank-btn">СБЕРБАНК</a><a href="https://tbank.ru" target="_blank" class="bank-btn">Т-БАНК</a></div><button class="btn" style="width:100%; margin-top:30px; border-color:#555; color:#555;" onclick="document.getElementById('pay-scr').style.display='block'; document.getElementById('sbp-scr').style.display='none'">НАЗАД</button></div></div>`);
        }
        else if (page === 'choice') { pc = wrap(`<div class="content-box"><h1>ДОСТУП</h1><button class="btn" onclick="navigate('login')">ЛОГИН</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div>`); }
        else if (page === 'profile') { pc = wrap(`<div class="content-box"><h1>КАБИНЕТ</h1><p style="font-size:22px;">Привет, <span style="color:var(--neon)">${user?.fio}</span>!</p><p>Email: ${user?.ema}</p><button class="btn" onclick="sessionStorage.removeItem('currentUser'); navigate('home');">ВЫЙТИ</button></div>`); }
        else if (page === 'contacts') { pc = wrap(`<div class="content-box"><h1>СВЯЗЬ</h1><p>Telegram: @HaLdjr</p></div>`); }
        else { pc = wrap(`<div class="content-box"><h1>CODE STUDIO «РЕКОРД»</h1><p>Инженерное образование высшего порядка.</p><div class="stats-grid"><div class="stat-card"><span class="stat-num">94%</span><span class="stat-txt">Успех</span></div><div class="stat-card"><span class="stat-num">500+</span><span class="stat-txt">Практика</span></div></div><button class="btn" onclick="${user ? 'navigate(\'profile\')' : 'navigate(\'choice\')'}">${user ? 'В ЛИЧНЫЙ КАБИНЕТ' : 'ВХОД В СИСТЕМУ'}</button></div>`); }
        contentDiv.innerHTML = nav + pc;
    }

    // --- ФИКС БЕЗУПРЕЧНОЙ ЛОГИКИ ---
    window.register = function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        if(!f || !l || !e || !p) return showStatus("ЗАПОЛНИТЕ ВСЕ ПОЛЯ!", false, true);
        showStatus("РЕГИСТРАЦИЯ...");
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?method=register&fio=${encodeURIComponent(f)}&login=${encodeURIComponent(l)}&ema=${encodeURIComponent(e)}&pass=${encodeURIComponent(p)}&callback=onRegOk&t=${Date.now()}`;
        document.body.appendChild(s);
    };
    window.onRegOk = () => { showStatus("УСПЕШНО!", false); setTimeout(() => { hideStatus(); navigate('login'); }, 1500); };

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        if(!l || !p) return showStatus("ВВЕДИТЕ ДАННЫЕ!", false, true);
        showStatus("ПРОВЕРКА..."); window.tempL = l; window.tempP = p;
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?callback=onLoginRes&t=${Date.now()}`;
        document.body.appendChild(s);
    };
    window.onLoginRes = (users) => {
        const u = users.find(x => String(x.login) === window.tempL && String(x.pass) === window.tempP);
        if(u) { showStatus("ВХОД...", false); sessionStorage.setItem('currentUser', JSON.stringify(u)); setTimeout(() => { hideStatus(); navigate('profile'); }, 1200); }
        else { showStatus("ДАННЫЕ НЕВЕРНЫ!", false, true); }
    };

    window.onpopstate = render; render();
</script>
</body>
</html>
