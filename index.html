<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <link rel="icon" href="image.png" type="image/png">
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); text-shadow: 0 0 8px var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        @keyframes pageIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: pageIn 0.5s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(180deg, rgba(5,7,10,0.8) 0%, rgba(5,7,10,1) 100%), url('geekbot_ru_1776150134725.png') no-repeat center center; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        
        .content-box { background: var(--card-bg); padding: 50px; border-radius: 30px; border: 1px solid rgba(0, 119, 255, 0.2); width: 100%; max-width: 1000px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); position: relative; overflow: hidden; }
        .content-box::before { content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--neon); }

        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 5px; color: var(--neon); margin-bottom: 30px; font-size: 36px; text-shadow: 0 0 10px var(--neon-glow); }
        h2 { color: var(--neon); font-family: 'Consolas', monospace; font-size: 24px; margin-top: 0; }

        /* Декор карточек курсов */
        .course-grid { display: grid; grid-template-columns: 1fr; gap: 25px; width: 100%; max-width: 900px; margin-top: 40px; }
        .course-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(0, 119, 255, 0.2); border-radius: 20px; padding: 40px; text-align: left; transition: var(--transit); position: relative; overflow: hidden; }
        .course-card:hover { border-color: var(--neon); background: rgba(0, 119, 255, 0.05); transform: translateY(-5px); box-shadow: 0 15px 40px var(--neon-glow); }
        .course-card .price { font-family: 'Consolas', monospace; font-weight: bold; color: #fff; margin: 15px 0; font-size: 22px; background: rgba(0, 119, 255, 0.1); display: inline-block; padding: 5px 15px; border-radius: 8px; }
        .course-card ul { padding-left: 20px; color: #aaa; font-size: 15px; line-height: 1.8; }
        .course-card ul li b { color: #fff; }

        .btn { background: transparent; color: var(--neon); padding: 16px 40px; border: 2px solid var(--neon); border-radius: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; outline: none; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 40px var(--neon); transform: scale(1.05); }

        .form-container { background: var(--card-bg); padding: 50px; border-radius: 30px; border: 1px solid var(--neon); width: 100%; max-width: 480px; box-shadow: 0 0 50px rgba(0, 119, 255, 0.1); }
        input { width: 100%; padding: 16px; margin: 12px 0; background: rgba(0,0,0,0.6); border: 1px solid #333; color: white; border-radius: 10px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--neon); background: rgba(0,0,0,0.8); box-shadow: 0 0 15px var(--neon-glow); outline: none; }

        /* Модальные окна */
        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: #0a0c10; border: 2px solid var(--neon); border-radius: 25px; padding: 50px; text-align: center; max-width: 500px; width: 90%; box-shadow: 0 0 100px rgba(0,119,255,0.3); }
        .loader { margin: 25px 0; width: 50px; height: 50px; border: 5px solid #111; border-top: 5px solid var(--neon); border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .info-text { line-height: 1.8; color: #ccc; font-size: 17px; text-align: justify; }
        .highlight { color: var(--neon); font-weight: bold; }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="status-card">
        <div id="status-text" style="font-family: 'Consolas', monospace; font-size: 20px; letter-spacing: 1px;"></div>
        <div id="status-loader" class="loader"></div>
        <div id="status-extra"></div>
        <button id="status-close" class="btn" style="display:none; font-size: 13px; margin-top:20px;" onclick="hideStatus(0)">ВЕРНУТЬСЯ</button>
    </div>
</div>

<div id="content"></div>

<script>
    const SHEET_URL = 'https://google.com';
    let generatedCode = null;

    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
        document.getElementById('status-extra').innerHTML = '';
    }

    function hideStatus(delay = 400) {
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay);
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        url.searchParams.forEach((v, k) => url.searchParams.delete(k));
        if (page !== 'home') {
            url.searchParams.set('page', page);
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    window.openPayment = function(name, price) {
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if(!user) {
            showStatus("НЕОБХОДИМА АВТОРИЗАЦИЯ", false, false);
            document.getElementById('status-extra').innerHTML = `
                <p style="color:#888; margin-bottom:20px">Для покупки курсов и доступа к материалам войдите в свою учетную запись.</p>
                <button class="btn" onclick="hideStatus(0); navigate('login')">ВОЙТИ</button>
                <button class="btn" style="border-color:#444; color:#666" onclick="hideStatus(0)">ОТМЕНА</button>`;
            return;
        }
        navigate('order', {item: name, price: price});
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        const nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}</div></nav>`;
        let pc = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        if (page === 'order') {
            const item = urlParams.get('item'), price = urlParams.get('price');
            pc = wrap(`<div class="content-box" style="max-width: 700px">
                <h1>ОФОРМЛЕНИЕ ЗАКАЗА</h1>
                <div style="background:rgba(0,119,255,0.05); padding:20px; border-radius:15px; margin-bottom:30px">
                    <p style="font-size:14px; color:#888; text-transform:uppercase">Выбранный продукт:</p>
                    <p style="color: var(--neon); font-size:24px; font-weight: bold; margin:5px 0">${item}</p>
                    <p style="font-size: 28px; font-family:Consolas">ИТОГО: ${price} ₽</p>
                </div>
                <div id="pay-scr">
                    <p style="margin-bottom:20px">ВЫБЕРИТЕ СПОСОБ ОПЛАТЫ:</p>
                    <div style="display:flex; gap:20px">
                        <button class="btn" style="flex:1" onclick="document.getElementById('card-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">💳 БАНКОВСКАЯ КАРТА</button>
                        <button class="btn" style="flex:1" onclick="document.getElementById('sbp-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">📲 СИСТЕМА СБП</button>
                    </div>
                </div>
                <div id="card-scr" style="display:none">
                    <input type="text" id="card_number" placeholder="НОМЕР КАРТЫ" maxlength="19" oninput="this.value = this.value.replace(/\\D/g,'').replace(/(.{4})/g, '$1 ').trim()">
                    <div style="display:flex; gap:15px">
                        <input type="text" id="card_date" placeholder="ММ / ГГ" style="flex:1" maxlength="7">
                        <input type="text" id="card_cvc" placeholder="CVC" style="flex:1" maxlength="3">
                    </div>
                    <button class="btn" style="width:100%; margin-top:20px" onclick="processPayment()">ПОДТВЕРДИТЬ ПЛАТЕЖ</button>
                </div>
                <div id="sbp-scr" style="display:none">
                     <p style="margin-bottom:20px">ВЫБЕРИТЕ ВАШ БАНК:</p>
                     <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px">
                        <a href="https://sberbank.ru" target="_blank" class="btn" style="text-decoration:none; text-align:center; font-size:12px">СБЕРБАНК</a>
                        <a href="https://tbank.ru" target="_blank" class="btn" style="text-decoration:none; text-align:center; font-size:12px">Т-БАНК</a>
                        <a href="https://alfabank.ru" target="_blank" class="btn" style="text-decoration:none; text-align:center; font-size:12px">АЛЬФА-БАНК</a>
                        <a href="https://vtb.ru" target="_blank" class="btn" style="text-decoration:none; text-align:center; font-size:12px">ВТБ</a>
                     </div>
                </div>
            </div>`);
        }
        else if (page === 'about') {
            pc = wrap(`<div class="content-box">
                <h1>О СТУДИИ «РЕКОРД»</h1>
                <p class="info-text">Мы — не просто курсы, мы <span class="highlight">экосистема</span> для тех, кто решил посвятить себя высоким технологиям. Наша миссия — сократить дистанцию между теорией и реальной работой в BigTech компаниях.</p>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px; margin-top:40px; text-align:left">
                    <div>
                        <h2 style="font-size:18px">🚀 ИНТЕНСИВНЫЙ РОСТ</h2>
                        <p style="font-size:14px; color:#999">Программа построена на методе "Sink or Swim" — мы погружаем вас в сложные задачи с первого дня, обеспечивая поддержку менторов 24/7.</p>
                    </div>
                    <div>
                        <h2 style="font-size:18px">🛡️ ЭТИЧНЫЙ ХАКИНГ</h2>
                        <p style="font-size:14px; color:#999">Наши лаборатории по кибербезопасности позволяют практиковаться в защищенной среде, имитируя реальные атаки.</p>
                    </div>
                    <div>
                        <h2 style="font-size:18px">🧠 НЕЙРОСЕТИ</h2>
                        <p style="font-size:14px; color:#999">Мы обучаем работе с архитектурами трансформеров и диффузионными моделями, которые меняют мир прямо сейчас.</p>
                    </div>
                    <div>
                        <h2 style="font-size:18px">🤝 СООБЩЕСТВО</h2>
                        <p style="font-size:14px; color:#999">После завершения обучения вы навсегда остаетесь в закрытом клубе «РЕКОРД» с доступом к вакансиям.</p>
                    </div>
                </div>
            </div>`);
        } 
        else if (page === 'services') {
            pc = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1>
            <div class="course-grid">
                <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')">
                    <h2>PYTHON DEVELOPER PRO</h2>
                    <div class="price">45 000 ₽</div>
                    <ul>
                        <li><b>Backend:</b> Django, FastAPI, Celery, Redis</li>
                        <li><b>Data:</b> PostgreSQL, SQLAlchemy, Миграции</li>
                        <li><b>DevOps:</b> Docker, CI/CD, Деплой на Linux</li>
                        <li><b>Проект:</b> Разработка высоконагруженного API</li>
                    </ul>
                </div>
                <div class="course-card" onclick="openPayment('Neural Networks & AI', '65 000')">
                    <h2>NEURAL NETWORKS & AI</h2>
                    <div class="price">65 000 ₽</div>
                    <ul>
                        <li><b>Deep Learning:</b> PyTorch, TensorFlow</li>
                        <li><b>NLP:</b> Обучение собственных LLM (GPT-style)</li>
                        <li><b>Vision:</b> Распознавание лиц и объектов</li>
                        <li><b>Математика:</b> Линейная алгебра для ИИ</li>
                    </ul>
                </div>
                <div class="course-card" onclick="openPayment('Cyber Security Expert', '80 000')">
                    <h2>CYBER SECURITY EXPERT</h2>
                    <div class="price">80 000 ₽</div>
                    <ul>
                        <li><b>Pentest:</b> Поиск уязвимостей (OWASP Top 10)</li>
                        <li><b>Forensics:</b> Расследование инцидентов</li>
                        <li><b>Reverse:</b> Анализ вредоносного ПО</li>
                        <li><b>Cloud:</b> Защита AWS/Azure инфраструктур</li>
                    </ul>
                </div>
            </div>`);
        }
        else if (page === 'contacts') {
            pc = wrap(`<div class="content-box">
                <h1>СВЯЗЬ С НАМИ</h1>
                <div style="margin:40px 0">
                    <p style="font-size:14px; color:#888; text-transform:uppercase; margin-bottom:10px">Главный канал связи:</p>
                    <a href="https://t.me" target="_blank" style="font-size:32px; color:var(--neon); text-decoration:none; font-weight:bold; display:block">TELEGRAM: @HaLdjr</a>
                </div>
                <div style="display:flex; justify-content:space-around; border-top:1px solid #222; padding-top:40px">
                    <div>
                        <p style="color:#555">EMAIL SUPPORT</p>
                        <p>record.edu@mail.ru</p>
                    </div>
                    <div>
                        <p style="color:#555">ТЕХНИЧЕСКИЙ ОТДЕЛ</p>
                        <p>dev.record@pro.io</p>
                    </div>
                </div>
                <p style="margin-top:50px; font-size:12px; color:#444">© 2024 CODE STUDIO «РЕКОРД». ВСЕ ПРАВА ЗАЩИЩЕНЫ.</p>
            </div>`);
        }
        else if (page === 'register') {
            pc = wrap(`<div class="form-container">
                <h1>РЕГИСТРАЦИЯ</h1>
                <p style="font-size:12px; color:#888; margin-bottom:20px">Введите реальную почту — на неё придет код подтверждения.</p>
                <input type="text" id="rFio" placeholder="ФАМИЛИЯ ИМЯ ОТЧЕСТВО">
                <input type="text" id="rLog" placeholder="ЛОГИН">
                <input type="email" id="rEma" placeholder="EMAIL АДРЕС">
                <input type="password" id="rPas" placeholder="ПАРОЛЬ">
                <button class="btn" style="width:100%; margin-left:0" onclick="startRegistration()">ПОЛУЧИТЬ КОД</button>
                <div class="form-footer">УЖЕ В СИСТЕМЕ? <a onclick="navigate('login')">ВОЙТИ</a></div>
            </div>`);
        } 
        else if (page === 'login') {
            pc = wrap(`<div class="form-container">
                <h1>ВХОД</h1>
                <input type="text" id="lLog" placeholder="ЛОГИН">
                <input type="password" id="lPas" placeholder="ПАРОЛЬ">
                <button class="btn" style="width:100%; margin-left:0" onclick="login()">АВТОРИЗАЦИЯ</button>
                <div class="form-footer">НЕТ АККАУНТА? <a onclick="navigate('register')">СОЗДАТЬ</a></div>
            </div>`);
        }
        else if (page === 'profile') {
            pc = wrap(`<div class="content-box">
                <h1>ЛИЧНЫЙ КАБИНЕТ</h1>
                <div style="text-align:left; background:rgba(255,255,255,0.02); padding:30px; border-radius:20px">
                    <p style="font-size:14px; color:#555">ПОЛЬЗОВАТЕЛЬ:</p>
                    <p style="font-size:24px; color:var(--neon); margin-bottom:20px">${user?.fio}</p>
                    <p><b>ЛОГИН:</b> ${user?.login}</p>
                    <p><b>EMAIL:</b> ${user?.ema}</p>
                    <p><b>СТАТУС:</b> <span style="color:#00ff00">ACTIVE MEMBER</span></p>
                </div>
                <button class="btn" style="margin-top:30px" onclick="logout()">ЗАВЕРШИТЬ СЕССИЮ</button>
            </div>`);
        }
        else if (page === 'choice') {
            pc = wrap(`<div class="content-box">
                <h1>ДОСТУП К СИСТЕМЕ</h1>
                <p style="margin-bottom:40px">Выберите действие для продолжения работы в студии</p>
                <button class="btn" onclick="navigate('login')">ВХОД В АККАУНТ</button>
                <button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button>
            </div>`);
        }
        else {
            pc = wrap(`<div class="content-box" style="border:none; background:transparent; box-shadow:none">
                <h1 style="font-size:54px; margin-bottom:10px">РЕКОРД</h1>
                <p style="font-size: 22px; letter-spacing:8px; color:var(--neon); margin-bottom:40px">CODE STUDIO PRO</p>
                <p style="max-width:600px; margin: 0 auto 40px; color:#888">Элитная кузница кадров для мировой IT-индустрии. Мы не обучаем хобби — мы строим карьеры.</p>
                <button class="btn" onclick="${user ? 'navigate(\'profile\')' : 'navigate(\'choice\')'}">${user ? 'ПЕРЕЙТИ В КАБИНЕТ' : 'ВСТУПИТЬ В СООБЩЕСТВО'}</button>
            </div>`);
        }
        contentDiv.innerHTML = nav + pc;
    }

    // ЛОГИКА С ПОЧТОЙ
    window.startRegistration = function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        if(!f || !l || !e || !p) return showStatus("ЗАПОЛНИТЕ ВСЕ ПОЛЯ РЕГИСТРАЦИИ!", false, true);
        
        generatedCode = Math.floor(100000 + Math.random() * 900000);
        showStatus("ГЕНЕРАЦИЯ И ОТПРАВКА КОДА...");
        
        const s = document.createElement('script');
        // ВАЖНО: В Apps Script должен быть метод sendCode как на скриншоте!
        s.src = `${SHEET_URL}?method=sendCode&email=${encodeURIComponent(e)}&code=${generatedCode}&callback=codeSent`;
        document.body.appendChild(s);
        
        window.regTemp = {f, l, e, p};
    };

    window.codeSent = () => {
        showStatus("КОД ОТПРАВЛЕН!", false);
        document.getElementById('status-extra').innerHTML = `
            <p style="color:#666; margin-bottom:15px; font-size:13px">ПРОВЕРЬТЕ ПАПКУ "СПАМ", ЕСЛИ ПИСЬМА НЕТ</p>
            <input type="text" id="vCode" placeholder="0 0 0 0 0 0" style="text-align:center; width:220px; font-size:24px; letter-spacing:5px">
            <br><button class="btn" onclick="verifyAndReg()">ПОДТВЕРДИТЬ</button>`;
    };

    window.verifyAndReg = () => {
        const input = document.getElementById('vCode').value;
        if(input == generatedCode) {
            showStatus("КОД ПОДТВЕРЖДЕН. СОЗДАНИЕ АККАУНТА...");
            const s = document.createElement('script');
            const {f, l, e, p} = window.regTemp;
            s.src = `${SHEET_URL}?method=register&fio=${encodeURIComponent(f)}&login=${encodeURIComponent(l)}&ema=${encodeURIComponent(e)}&pass=${encodeURIComponent(p)}&callback=regOk`;
            document.body.appendChild(s);
        } else {
            alert("НЕВЕРНЫЙ КОД ПОДТВЕРЖДЕНИЯ!");
        }
    };

    window.regOk = () => { showStatus("АККАУНТ УСПЕШНО СОЗДАН!", false); setTimeout(() => { hideStatus(); navigate('login'); }, 1500); };

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        if(!l || !p) return showStatus("ВВЕДИТЕ ЛОГИН И ПАРОЛЬ!", false, true);
        showStatus("СИНХРОНИЗАЦИЯ С БАЗОЙ...");
        window.tempL = l; window.tempP = p;
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?callback=logOk`;
        document.body.appendChild(s);
    };

    window.logOk = (users) => {
        const u = users.find(x => String(x.login) === window.tempL && String(x.pass) === window.tempP);
        if(u) { sessionStorage.setItem('currentUser', JSON.stringify(u)); showStatus("ДОСТУП РАЗРЕШЕН!", false); setTimeout(() => { hideStatus(); navigate('profile'); }, 1000); }
        else showStatus("ОШИБКА: ДАННЫЕ НЕ НАЙДЕНЫ", false, true);
    };

    window.processPayment = () => {
        showStatus("ПРОВЕРКА ТРАНЗАКЦИИ...");
        setTimeout(() => { showStatus("ОПЛАТА ПОДТВЕРЖДЕНА!", false); setTimeout(() => { hideStatus(); navigate('profile'); }, 2000); }, 2000);
    };

    window.logout = () => { sessionStorage.removeItem('currentUser'); navigate('home'); };
    window.onpopstate = render;
    render();
</script>
</body>
</html>
