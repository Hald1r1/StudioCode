<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <link rel="icon" href="image.png" type="image/png">
    <script src="https://jsdelivr.net"></script>

    <style>
        :root {
            /* ИЗМЕНЕНО: Более насыщенный синий неон */
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        @keyframes pageIn { from { opacity: 0; transform: translateY(20px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .animate-page { animation: pageIn 0.8s forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }

        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.85), rgba(5, 7, 10, 0.85)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.3); width: 100%; max-width: 900px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); margin-bottom: 25px; font-size: 32px; }

        .pay-methods { display: flex; gap: 15px; margin: 30px 0; justify-content: center; }
        .pay-method-btn { flex: 1; padding: 20px; border: 1px solid #444; border-radius: 15px; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02); font-weight: bold; }
        .pay-method-btn.active { border-color: var(--neon); background: rgba(0, 119, 255, 0.05); box-shadow: 0 0 20px var(--neon-glow); color: var(--neon); }

        .pay-form { display: none; text-align: left; max-width: 400px; margin: 0 auto; }
        .pay-form.active { display: block; animation: pageIn 0.5s; }

        .course-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 850px; margin-top: 30px; }
        .course-card { background: var(--card-bg); border: 1px solid rgba(0, 119, 255, 0.4); border-radius: 15px; padding: 35px; text-align: left; transition: var(--transit); cursor: pointer; }
        .course-card:hover { transform: translateY(-5px) scale(1.01); border-color: var(--neon); box-shadow: 0 15px 45px var(--neon-glow); }
        .course-card h2 { color: var(--neon); margin: 0; font-size: 26px; }
        .course-card .price { font-weight: bold; color: #ffffff; margin: 10px 0; font-size: 19px; letter-spacing: 1px; }
        .course-card .info { font-size: 17px; color: #f0f0f0; line-height: 1.6; border-top: 1px solid rgba(0,119,255,0.1); padding-top: 15px; }

        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); transform: scale(1.05); }

        .form-container { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--neon); width: 100%; max-width: 450px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #555; color: white; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 10px var(--neon-glow); }

        .form-footer { margin-top: 25px; font-size: 14px; color: #8b949e; }
        .form-footer a { color: var(--neon); text-decoration: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
    </style>
</head>
<body>

<div id="content"></div>

<script>
    // --- ДВИЖОК SPA ---
    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        if (page === 'home') {
            url.searchParams.delete('page');
            const keys = Array.from(url.searchParams.keys());
            keys.forEach(k => url.searchParams.delete(k));
        } else {
            url.searchParams.set('page', page);
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        const nav = `
            <nav>
                <div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div>
                <div class="nav-links">
                    <a onclick="navigate('home')">Главная</a>
                    <a onclick="navigate('about')">О нас</a>
                    <a onclick="navigate('services')">Курсы</a>
                    <a onclick="navigate('contacts')">Контакты</a>
                </div>
                <div class="nav-auth">
                    ${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}
                </div>
            </nav>`;

        let pc = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        if (page === 'about') {
            pc = wrap(`
                <div class="content-box">
                    <h1>О СТУДИИ</h1>
                    <p style="line-height:1.8; font-size: 19px; text-align: justify; color: #ffffff;">
                        Code Studio «РЕКОРД» — это инновационная образовательная платформа, созданная для подготовки специалистов мирового уровня. Мы не просто учим писать код, мы формируем инженерное мышление. <br><br>
                        Наши программы разработаны совместно с ведущими архитекторами из BigTech компаний. Мы используем метод полного погружения: 20% теории и 80% интенсивной практики на реальных кейсах.
                    </p>
                </div>`);
        } 
        else if (page === 'services') {
            pc = wrap(`
                <h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1>
                <div class="course-grid">
                    <div class="course-card" onclick="handleBuy('Python Developer Pro', '45 000')">
                        <h2>Python Developer Pro</h2>
                        <div class="price">45 000 ₽ / 6 месяцев</div>
                        <div class="info">Глубокое изучение синтаксиса, бэкенд-разработка на Django и FastAPI. Работа с базами данных PostgreSQL, создание высоконагруженных API и автоматизация бизнес-процессов.</div>
                    </div>
                    <div class="course-card" onclick="handleBuy('Neural Networks & AI', '65 000')">
                        <h2>Neural Networks & AI</h2>
                        <div class="price">65 000 ₽ / 9 месяцев</div>
                        <div class="info">От математических основ Data Science до обучения современных LLM. Работа с PyTorch, Computer Vision (CV) и Natural Language Processing (NLP).</div>
                    </div>
                    <div class="course-card" onclick="handleBuy('Cyber Security Expert', '80 000')">
                        <h2>Cyber Security Expert</h2>
                        <div class="price">80 000 ₽ / 12 месяцев</div>
                        <div class="info">Станьте «белым» хакером. Этичный хакинг, реверс-инжиниринг, поиск уязвимостей в корпоративном коде и защита облачных инфраструктур.</div>
                    </div>
                </div>`);
        }
        else if (page === 'payment') {
            const item = urlParams.get('item');
            const price = urlParams.get('price');
            pc = wrap(`
                <div class="content-box" style="max-width: 550px">
                    <h1>ОФОРМЛЕНИЕ</h1>
                    <p style="font-size: 18px; margin-bottom: 5px;">Выбранный курс:</p>
                    <p style="font-size: 22px; font-weight: bold; color:var(--neon); margin-top: 0;">${item}</p>
                    <p style="font-size: 24px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 20px;">К оплате: ${price} ₽</p>
                    
                    <div class="pay-methods">
                        <div id="btnCard" class="pay-method-btn active" onclick="switchPay('card')">💳 КАРТА</div>
                        <div id="btnSbp" class="pay-method-btn" onclick="switchPay('sbp')">📲 СБП</div>
                    </div>

                    <div id="formCard" class="pay-form active">
                        <input type="text" placeholder="0000 0000 0000 0000">
                        <div style="display:flex; gap:10px">
                            <input type="text" placeholder="ММ/ГГ">
                            <input type="text" placeholder="CVC">
                        </div>
                        <button class="btn" style="width:100%; margin: 20px 0 0" onclick="confirmPay()">ОПЛАТИТЬ</button>
                    </div>

                    <div id="formSbp" class="pay-form">
                        <input type="text" placeholder="+7 (___) ___-__-__">
                        <button class="btn" style="width:100%; margin: 20px 0 0; border-color:#005bff; color:#005bff" onclick="confirmPay()">В ПРИЛОЖЕНИЕ БАНКА</button>
                    </div>
                </div>`);
        }
        else if (page === 'profile') {
            pc = wrap(`<div class="content-box"><h1>КАБИНЕТ</h1><p style="font-size: 22px;">Добро пожаловать, <span style="color:var(--neon)">${user?.fio || 'Гость'}</span>!</p><button class="btn" onclick="logout()">ВЫЙТИ</button></div>`);
        } 
        else if (page === 'login') {
            pc = wrap(`
                <div class="form-container">
                    <h1>ВХОД</h1>
                    <input type="text" id="lLog" placeholder="Ваш логин">
                    <input type="password" id="lPas" placeholder="Пароль">
                    <button class="btn" onclick="login()">ВОЙТИ</button>
                    <div class="form-footer">
                        Нет аккаунта? <a onclick="navigate('register')">Зарегистрируйтесь</a>
                    </div>
                </div>`);
        } 
        else if (page === 'register') {
            pc = wrap(`
                <div class="form-container">
                    <h1>РЕГИСТРАЦИЯ</h1>
                    <input type="text" id="rFio" placeholder="Полное ФИО">
                    <input type="text" id="rLog" placeholder="Логин">
                    <input type="email" id="rEma" placeholder="Email">
                    <input type="password" id="rPas" placeholder="Пароль">
                    <button class="btn" onclick="register()">СОЗДАТЬ</button>
                    <div class="form-footer">
                        Уже есть аккаунт? <a onclick="navigate('login')">Войти</a>
                    </div>
                </div>`);
        } 
        else if (page === 'choice') {
            pc = wrap(`<div class="content-box"><h1>ДОСТУП</h1><button class="btn" onclick="navigate('login')">ЛОГИН</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div>`);
        }
        else if (page === 'contacts') {
            pc = wrap(`<div class="content-box"><h1>СВЯЗЬ</h1><p style="font-size: 24px">Telegram: <a href="https://t.me" style="color:var(--neon); text-decoration:none;">@HaLdjr</a></p></div>`);
        }
        else {
            pc = wrap(`
                <div class="content-box">
                    <h1>CODE STUDIO «РЕКОРД»</h1>
                    <p style="font-size: 22px; margin-bottom:30px">Твой путь в элиту IT. Практика с первого дня.</p>
                    <button class="btn" onclick="navigate('choice')">ВХОД В СИСТЕМУ</button>
                </div>`);
        }
        contentDiv.innerHTML = nav + pc;
    }

    // --- ЛОГИКА ---
    window.register = async function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        if(!f || !l || !e || !p) return alert("Заполните все поля!");
        
        // Временная имитация до подключения ключей Supabase
        let users = JSON.parse(localStorage.getItem('studio_db') || '[]');
        if(users.find(u => u.login === l)) return alert("Логин занят!");
        users.push({fio: f, login: l, email: e, pass: p});
        localStorage.setItem('studio_db', JSON.stringify(users));
        alert("Регистрация успешна!"); navigate('login');
    }

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        let users = JSON.parse(localStorage.getItem('studio_db') || '[]');
        const user = users.find(u => u.login === l && u.pass === p);
        if (user) { sessionStorage.setItem('currentUser', JSON.stringify(user)); navigate('profile'); }
        else alert("Неверные данные!");
    }

    window.handleBuy = (name, price) => {
        if (!sessionStorage.getItem('currentUser')) {
            alert("Пожалуйста, авторизуйтесь перед покупкой!");
            navigate('login');
            return;
        }
        navigate('payment', { item: name, price: price });
    }

    window.switchPay = (type) => {
        document.getElementById('formCard').classList.toggle('active', type === 'card');
        document.getElementById('formSbp').classList.toggle('active', type === 'sbp');
        document.getElementById('btnCard').classList.toggle('active', type === 'card');
        document.getElementById('btnSbp').classList.toggle('active', type === 'sbp');
    }

    window.confirmPay = () => { alert("Запрос обрабатывается..."); setTimeout(() => { alert("Оплата подтверждена!"); navigate('profile'); }, 1500); }
    window.logout = () => { sessionStorage.removeItem('currentUser'); navigate('home'); }
    window.onpopstate = render;
    render();
</script>
</body>
</html>
