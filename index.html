<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <link rel="icon" href="image.png" type="image/png">
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5,7,10,0.9), rgba(5,7,10,0.9)), url('geekbot_ru_1776150134725.png') no-repeat center center; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.3); width: 100%; max-width: 900px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); margin-bottom: 25px; font-size: 32px; }

        .course-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 850px; margin-top: 30px; }
        .course-card { background: var(--card-bg); border: 1px solid rgba(0, 119, 255, 0.4); border-radius: 15px; padding: 35px; text-align: left; transition: var(--transit); cursor: pointer; }
        .course-card:hover { border-color: var(--neon); box-shadow: 0 10px 30px var(--neon-glow); transform: scale(1.01); }
        .course-card h2 { color: var(--neon); margin: 0; font-size: 26px; }
        .course-card .price { font-weight: bold; color: #ffffff; margin: 10px 0; font-size: 19px; }
        .course-card .info { font-size: 16px; color: #ccc; line-height: 1.5; border-top: 1px solid rgba(0,119,255,0.1); padding-top: 15px; }

        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }

        .form-container { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--neon); width: 100%; max-width: 450px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #333; color: white; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: var(--neon); outline: none; }

        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: var(--card-bg); border: 2px solid var(--neon); border-radius: 20px; padding: 40px; text-align: center; max-width: 450px; width: 90%; }
        .loader { margin-top: 20px; width: 40px; height: 40px; border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .feature-list { text-align: left; margin: 20px 0; color: #ddd; line-height: 1.8; }
        .feature-list b { color: var(--neon); }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="status-card">
        <div id="status-text" style="font-family: monospace; font-size: 18px;"></div>
        <div id="status-loader" class="loader"></div>
        <div id="status-extra" style="margin-top:20px"></div>
        <button id="status-close" class="btn" style="display:none; font-size: 12px;" onclick="hideStatus(0)">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="content"></div>

<script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbylaQeWWvNaI6nov-bVns_C_V2Du6xR-rkZO64Ku_PLq7lVuO5m2hCjAvBNCm_EeQBjoA/exec';
    let generatedCode = null;

    function showStatus(text, showLoader = true, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
        document.getElementById('status-extra').innerHTML = '';
    }

    function hideStatus(delay = 400) {
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay);
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        url.searchParams.forEach((v, k) => url.searchParams.delete(k));
        if (page !== 'home') {
            url.searchParams.set('page', page);
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    window.openPayment = function(name, price) {
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if(!user) {
            showStatus("ДЛЯ ПОКУПКИ КУРСА НЕОБХОДИМО АВТОРИЗОВАТЬСЯ", false, false);
            document.getElementById('status-extra').innerHTML = `<button class="btn" onclick="hideStatus(0); navigate('login')">ВОЙТИ</button><button class="btn" style="border-color:#555" onclick="hideStatus(0)">ОТМЕНА</button>`;
            return;
        }
        navigate('order', {item: name, price: price});
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        const nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}</div></nav>`;
        let pc = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        if (page === 'order') {
            const item = urlParams.get('item'), price = urlParams.get('price');
            pc = wrap(`<div class="content-box" style="max-width: 650px"><h1>ОФОРМЛЕНИЕ</h1><p style="color: var(--neon); font-weight: bold;">${item}</p><p style="font-size: 26px; border-bottom: 1px solid #333; padding-bottom: 20px;">К оплате: ${price} ₽</p><div id="pay-scr"><p>ВЫБЕРИТЕ МЕТОД ОПЛАТЫ:</p><div style="display:flex; gap:20px; margin-top:20px"><button class="btn" style="flex:1" onclick="document.getElementById('card-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">💳 КАРТА</button><button class="btn" style="flex:1" onclick="document.getElementById('sbp-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">📲 СБП</button></div></div><div id="card-scr" style="display:none"><input type="text" id="card_number" placeholder="0000 0000 0000 0000" maxlength="19" oninput="this.value = this.value.replace(/\\D/g,'').replace(/(.{4})/g, '$1 ').trim()"><div style="display:flex; gap:10px"><input type="text" id="card_date" placeholder="ММ / ГГ" style="flex:1" maxlength="7"><input type="text" id="card_cvc" placeholder="CVC" style="flex:1" maxlength="3"></div><button class="btn" style="width:100%; margin-top:20px" onclick="processPayment()">ОПЛАТИТЬ</button></div><div id="sbp-scr" style="display:none"><div class="bank-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><a href="https://sberbank.ru" target="_blank" class="btn" style="text-decoration:none; text-align:center">СБЕР</a><a href="https://tbank.ru" target="_blank" class="btn" style="text-decoration:none; text-align:center">Т-БАНК</a></div></div></div>`);
        }
        else if (page === 'about') {
            pc = wrap(`<div class="content-box"><h1>О СТУДИИ «РЕКОРД»</h1>
                <p style="font-size: 18px; color: #fff;">Мы — закрытое сообщество инженеров и разработчиков. Наша цель — вырастить поколение IT-специалистов, способных решать задачи любой сложности.</p>
                <div class="feature-list">
                    <p>● <b>HARD-CORE ПРАКТИКА:</b> Никаких скучных лекций. Только написание кода и ревью от экспертов.</p>
                    <p>● <b>NETWORKING:</b> Доступ в закрытый чат с разработчиками из Яндекса, Google и Telegram.</p>
                    <p>● <b>ТРУДОУСТРОЙСТВО:</b> Помогаем составить резюме и готовим к техническим интервью в BigTech.</p>
                    <p>● <b>АКТУАЛЬНОСТЬ:</b> Обновляем программу каждые 3 месяца под запросы рынка.</p>
                </div></div>`);
        } 
        else if (page === 'services') {
            pc = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1><div class="course-grid">
                <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')"><h2>Python Developer Pro</h2><div class="price">45 000 ₽ / 6 месяцев</div><div class="info">Backend, Django, FastAPI, PostgreSQL. От основ до архитектуры систем.</div></div>
                <div class="course-card" onclick="openPayment('Neural Networks & AI', '65 000')"><h2>Neural Networks & AI</h2><div class="price">65 000 ₽ / 9 месяцев</div><div class="info">Математика, PyTorch, обучение LLM моделей и Computer Vision.</div></div>
                <div class="course-card" onclick="openPayment('Cyber Security Expert', '80 000')"><h2>Cyber Security Expert</h2><div class="price">80 000 ₽ / 12 месяцев</div><div class="info">Этичный хакинг, защита сетей, реверс-инжиниринг и криптография.</div></div>
            </div>`);
        }
        else if (page === 'contacts') {
            pc = wrap(`<div class="content-box"><h1>КОНТАКТЫ</h1>
                <p>По вопросам сотрудничества и техподдержки:</p>
                <p style="font-size: 20px;">Telegram: <a href="https://t.me" target="_blank" style="color:var(--neon); text-decoration:none;">@HaLdjr</a></p>
                <p>Email: <span style="color:var(--neon)">support@record-studio.pro</span></p>
                <p style="margin-top:20px; font-size:14px; color:#666">Режим работы: 24/7 (Ответ в течение 15 минут)</p></div>`);
        }
        else if (page === 'register') {
            pc = wrap(`<div class="form-container"><h1>РЕГИСТРАЦИЯ</h1>
                <input type="text" id="rFio" placeholder="Фамилия Имя Отчество">
                <input type="text" id="rLog" placeholder="Придумайте логин">
                <input type="email" id="rEma" placeholder="Ваша почта (для кода)">
                <input type="password" id="rPas" placeholder="Пароль">
                <button class="btn" onclick="startRegistration()">ОТПРАВИТЬ КОД</button>
                <div class="form-footer">Есть аккаунт? <a onclick="navigate('login')">Войти</a></div></div>`);
        } 
        else if (page === 'login') {
            pc = wrap(`<div class="form-container"><h1>ВХОД</h1><input type="text" id="lLog" placeholder="Логин"><input type="password" id="lPas" placeholder="Пароль"><button class="btn" onclick="login()">ВОЙТИ</button><div class="form-footer">Нет аккаунта? <a onclick="navigate('register')">Создать</a></div></div>`);
        }
        else if (page === 'profile') {
            pc = wrap(`<div class="content-box"><h1>ЛИЧНЫЙ КАБИНЕТ</h1><p>С возвращением, <b style="color:var(--neon)">${user?.fio}</b></p><p>Ваш статус: <span style="color:#00ff00">STUDENT [PRO]</span></p><button class="btn" onclick="logout()">ВЫЙТИ ИЗ СИСТЕМЫ</button></div>`);
        }
        else if (page === 'choice') {
            pc = wrap(`<div class="content-box"><h1>ДОСТУП</h1><button class="btn" onclick="navigate('login')">ВХОД</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div>`);
        }
        else {
            pc = wrap(`<div class="content-box"><h1>CODE STUDIO «РЕКОРД»</h1><p style="font-size: 20px; margin-bottom:30px">Экосистема для будущих Tech-лидеров.</p><button class="btn" onclick="${user ? 'navigate(\'profile\')' : 'navigate(\'choice\')'}">${user ? 'МОЙ КАБИНЕТ' : 'НАЧАТЬ ОБУЧЕНИЕ'}</button></div>`);
        }
        contentDiv.innerHTML = nav + pc;
    }

    // ЛОГИКА РЕГИСТРАЦИИ С ПИСЬМОМ
    window.startRegistration = function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        if(!f || !l || !e || !p) return showStatus("ЗАПОЛНИТЕ ВСЕ ПОЛЯ!", false, true);
        
        generatedCode = Math.floor(100000 + Math.random() * 900000);
        showStatus("ОТПРАВКА КОДА НА ПОЧТУ...");
        
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?method=sendCode&email=${encodeURIComponent(e)}&code=${generatedCode}&callback=codeSent`;
        document.body.appendChild(s);
        
        // Сохраняем данные временно
        window.regTemp = {f, l, e, p};
    };

    window.codeSent = () => {
        showStatus("КОД ОТПРАВЛЕН!", false);
        document.getElementById('status-extra').innerHTML = `
            <input type="text" id="vCode" placeholder="ВВЕДИТЕ 6 ЦИФР" style="text-align:center; width:200px">
            <br><button class="btn" onclick="verifyAndReg()">ПОДТВЕРДИТЬ</button>`;
    };

    window.verifyAndReg = () => {
        const input = document.getElementById('vCode').value;
        if(input == generatedCode) {
            showStatus("КОД ВЕРЕН! ЗАПИСЬ В БАЗУ...");
            const s = document.createElement('script');
            const {f, l, e, p} = window.regTemp;
            s.src = `${SHEET_URL}?method=register&fio=${encodeURIComponent(f)}&login=${encodeURIComponent(l)}&ema=${encodeURIComponent(e)}&pass=${encodeURIComponent(p)}&callback=regOk`;
            document.body.appendChild(s);
        } else {
            alert("НЕВЕРНЫЙ КОД!");
        }
    };

    window.regOk = () => { showStatus("РЕГИСТРАЦИЯ ЗАВЕРШЕНА!", false); setTimeout(() => { hideStatus(); navigate('login'); }, 1500); };

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        if(!l || !p) return showStatus("ВВЕДИТЕ ДАННЫЕ!", false, true);
        showStatus("АВТОРИЗАЦИЯ...");
        window.tempL = l; window.tempP = p;
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?callback=logOk`;
        document.body.appendChild(s);
    };

    window.logOk = (users) => {
        const u = users.find(x => String(x.login) === window.tempL && String(x.pass) === window.tempP);
        if(u) { sessionStorage.setItem('currentUser', JSON.stringify(u)); showStatus("ДОБРО ПОЖАЛОВАТЬ!", false); setTimeout(() => { hideStatus(); navigate('profile'); }, 1000); }
        else showStatus("ОШИБКА ДОСТУПА", false, true);
    };

    window.processPayment = () => {
        showStatus("ПРОВЕРКА ТРАНЗАКЦИИ...");
        setTimeout(() => { showStatus("ОПЛАТА ПРИНЯТА!", false); setTimeout(() => { hideStatus(); navigate('profile'); }, 2000); }, 2000);
    };

    window.logout = () => { sessionStorage.removeItem('currentUser'); navigate('home'); };
    window.onpopstate = render;
    render();
</script>
</body>
</html>
