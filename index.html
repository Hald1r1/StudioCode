<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <link rel="icon" href="image.png" type="image/png">

    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        @keyframes pageIn { from { opacity: 0; transform: translateY(20px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .animate-page { animation: pageIn 0.8s forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }

        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.85), rgba(5, 7, 10, 0.85)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.3); width: 100%; max-width: 900px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); margin-bottom: 25px; font-size: 32px; }

        .course-grid { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 850px; margin-top: 30px; }
        .course-card { background: var(--card-bg); border: 1px solid rgba(0, 119, 255, 0.4); border-radius: 15px; padding: 35px; text-align: left; transition: var(--transit); cursor: pointer; }
        .course-card:hover { transform: translateY(-5px) scale(1.01); border-color: var(--neon); box-shadow: 0 15px 45px var(--neon-glow); }
        .course-card h2 { color: var(--neon); margin: 0; font-size: 26px; }
        .course-card .price { font-weight: bold; color: #ffffff; margin: 10px 0; font-size: 19px; letter-spacing: 1px; }
        .course-card .info { font-size: 17px; color: #f0f0f0; line-height: 1.6; border-top: 1px solid rgba(0,119,255,0.1); padding-top: 15px; }

        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); transform: scale(1.05); }

        .form-container { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--neon); width: 100%; max-width: 450px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #555; color: white; border-radius: 8px; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 10px var(--neon-glow); }

        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: var(--card-bg); border: 2px solid var(--neon); border-radius: 20px; padding: 40px 60px; text-align: center; box-shadow: 0 0 50px var(--neon-glow); }
        #status-text { font-family: 'Consolas', monospace; font-size: 24px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; color: #fff; }
        .loader { margin-top: 25px; width: 45px; height: 45px; border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .pay-choice-grid { display: flex; gap: 20px; margin-top: 35px; width: 100%; }
        .pay-btn-box { flex: 1; padding: 35px; border: 1px solid #333; border-radius: 20px; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.02); text-align: center; font-weight: bold; font-size: 18px; }
        .pay-btn-box:hover { border-color: var(--neon); box-shadow: 0 0 25px var(--neon-glow); color: var(--neon); }
        .bank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; width: 100%; }
        .bank-btn { padding: 20px; border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 12px; cursor: pointer; transition: 0.3s; background: #0a0c10; font-weight: bold; text-decoration: none; color: #fff; display: block; text-align: center; }
        .bank-btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="status-card">
        <div id="status-text"></div>
        <div id="status-loader" class="loader"></div>
    </div>
</div>

<div id="content"></div>

<script>
    const SHEET_URL = 'https://google.com';

    function showStatus(text, showLoader = true) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
    }

    function hideStatus(delay = 500) {
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay);
    }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        if (page === 'home') {
            const keys = Array.from(url.searchParams.keys());
            keys.forEach(k => url.searchParams.delete(k));
        } else {
            url.searchParams.set('page', page);
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    window.openPayment = function(name, price) {
        const url = `${window.location.origin}${window.location.pathname}?page=order&item=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}`;
        window.open(url, '_blank');
    };

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        const nav = `<nav><div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}</div></nav>`;
        let pc = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        if (page === 'order') {
            const item = urlParams.get('item'), price = urlParams.get('price');
            pc = wrap(`
                <div class="content-box" style="max-width: 650px">
                    <h1>ОФОРМЛЕНИЕ</h1>
                    <p style="font-size: 22px; color: var(--neon); font-weight: bold;">${item}</p>
                    <p style="font-size: 26px; border-bottom: 1px solid #333; padding-bottom: 20px;">К оплате: ${price} ₽</p>
                    <div id="pay-methods-screen">
                        <p>ВЫБЕРИТЕ МЕТОД ОПЛАТЫ:</p>
                        <div class="pay-choice-grid">
                            <div class="pay-btn-box" onclick="document.getElementById('card-form').style.display='block'; document.getElementById('pay-methods-screen').style.display='none';">💳 КАРТА</div>
                            <div class="pay-btn-box" onclick="document.getElementById('sbp-form').style.display='block'; document.getElementById('pay-methods-screen').style.display='none';">📲 СБП</div>
                        </div>
                    </div>
                    <div id="card-form" style="display:none">
                        <input type="text" placeholder="Номер карты"><div style="display:flex; gap:10px"><input type="text" placeholder="ММ/ГГ"><input type="text" placeholder="CVC"></div>
                        <button class="btn" style="width:100%; margin-top:20px" onclick="showStatus('ОБРАБОТКА...'); setTimeout(()=>showStatus('ПЛАТЕЖ ПРИНЯТ!', false), 1500); setTimeout(()=>hideStatus(), 3000);">ОПЛАТИТЬ</button>
                    </div>
                    <div id="sbp-form" style="display:none"><p>ВЫБЕРИТЕ БАНК:</p><div class="bank-grid"><a href="https://sberbank.ru" target="_blank" class="bank-btn">СБЕРБАНК</a><a href="https://tbank.ru" target="_blank" class="bank-btn">Т-БАНК</a><a href="https://alfabank.ru" target="_blank" class="bank-btn">АЛЬФА</a><a href="https://vtb.ru" target="_blank" class="bank-btn">ВТБ</a></div></div>
                </div>`);
        }
        else if (page === 'about') {
            pc = wrap(`<div class="content-box"><h1>О СТУДИИ</h1><p style="line-height:1.8; font-size: 19px; text-align: justify; color: #ffffff;">Code Studio «РЕКОРД» — это инновационная образовательная платформа, созданная для подготовки специалистов мирового уровня. Мы не просто учим писать код, мы формируем инженерное мышление. <br><br> Наши программы разработаны совместно с ведущими архитекторами из BigTech компаний. Мы используем метод полного погружения: 20% теории и 80% интенсивной практики на реальных кейсах.</p></div>`);
        } 
        else if (page === 'services') {
            pc = wrap(`<h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1><div class="course-grid">
                    <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')"><h2>Python Developer Pro</h2><div class="price">45 000 ₽ / 6 месяцев</div><div class="info">Глубокое изучение синтаксиса, бэкенд-разработка на Django и FastAPI. Работа с базами данных PostgreSQL, создание высоконагруженных API и автоматизация бизнес-процессов.</div></div>
                    <div class="course-card" onclick="openPayment('Neural Networks & AI', '65 000')"><h2>Neural Networks & AI</h2><div class="price">65 000 ₽ / 9 месяцев</div><div class="info">От математических основ Data Science до обучения современных LLM. Работа с PyTorch, Computer Vision (CV) и Natural Language Processing (NLP).</div></div>
                    <div class="course-card" onclick="openPayment('Cyber Security Expert', '80 000')"><h2>Cyber Security Expert</h2><div class="price">80 000 ₽ / 12 месяцев</div><div class="info">Станьте «белым» хакером. Этичный хакинг, реверс-инжиниринг, поиск уязвимостей в корпоративном коде и защита облачных инфраструктур.</div></div>
                </div>`);
        }
        else if (page === 'contacts') {
            pc = wrap(`<div class="content-box"><h1>СВЯЗЬ</h1><p style="font-size: 24px">Telegram: <a href="https://t.me" target="_blank" style="color:var(--neon); text-decoration:none;">@HaLdjr</a></p></div>`);
        }
        else if (page === 'register') {
            pc = wrap(`<div class="form-container"><h1>РЕГИСТРАЦИЯ</h1><input type="text" id="rFio" placeholder="Полное ФИО"><input type="text" id="rLog" placeholder="Логин"><input type="email" id="rEma" placeholder="Email"><input type="password" id="rPas" placeholder="Пароль"><button class="btn" onclick="register()">СОЗДАТЬ</button></div>`);
        } 
        else if (page === 'login') {
            pc = wrap(`<div class="form-container"><h1>ВХОД</h1><input type="text" id="lLog" placeholder="Ваш логин"><input type="password" id="lPas" placeholder="Пароль"><button class="btn" onclick="login()">ВОЙТИ</button></div>`);
        }
        else if (page === 'profile') {
            pc = wrap(`<div class="content-box"><h1>КАБИНЕТ</h1><p style="font-size: 22px;">Привет, <span style="color:var(--neon)">${user?.fio}</span>!</p><p>Email: ${user?.ema}</p><button class="btn" onclick="logout()">ВЫЙТИ</button></div>`);
        }
        else if (page === 'choice') {
            pc = wrap(`<div class="content-box"><h1>ДОСТУП</h1><button class="btn" onclick="navigate('login')">ЛОГИН</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div>`);
        }
        else {
            pc = wrap(`<div class="content-box"><h1>CODE STUDIO «РЕКОРД»</h1><p style="font-size: 22px; margin-bottom:30px">Твой путь в элиту IT. Практика с первого дня.</p><button class="btn" onclick="navigate('choice')">ВХОД В СИСТЕМУ</button></div>`);
        }
        contentDiv.innerHTML = nav + pc;
    }

    // --- ФИНАЛЬНАЯ ЛОГИКА ---
    window.register = function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        if(!f || !l || !e || !p) return alert("Заполните все поля!");

        showStatus("РЕГИСТРАЦИЯ...");

        // Отправка через параметры URL (Query Params) - самый надежный метод
        const finalUrl = `${SHEET_URL}?fio=${encodeURIComponent(f)}&login=${encodeURIComponent(l)}&ema=${encodeURIComponent(e)}&pass=${encodeURIComponent(p)}`;
        
        fetch(finalUrl, { mode: 'no-cors' })
        .then(() => {
            setTimeout(() => {
                showStatus("УСПЕШНАЯ РЕГИСТРАЦИЯ!", false);
                setTimeout(() => { hideStatus(); navigate('login'); }, 1500);
            }, 1000);
        }).catch(() => { hideStatus(0); alert("Ошибка сети"); });
    };

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        if(!l || !p) return alert("Введите данные!");
        showStatus("ПРОВЕРКА ДАННЫХ...");

        fetch(SHEET_URL)
        .then(res => res.json())
        .then(users => {
            const user = users.find(u => String(u.login) === l && String(u.pass) === p);
            if (user) {
                showStatus("УСПЕШНЫЙ ВХОД!", false);
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                setTimeout(() => { hideStatus(); navigate('profile'); }, 1500);
            } else { hideStatus(0); alert("Ошибка: Данные неверны!"); }
        }).catch(() => { hideStatus(0); alert("Ошибка связи"); });
    };

    window.logout = () => { sessionStorage.removeItem('currentUser'); navigate('home'); };
    window.onpopstate = render;
    render();
</script>
</body>
</html>
