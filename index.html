<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «Рекорд» | Cloud</title>
    
    <!-- ИСПРАВЛЕННЫЕ ССЫЛКИ -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        :root {
            --neon: #00f2ff;
            --bg: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.85);
            --transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Consolas', 'Monaco', monospace; background-color: var(--bg); color: #e6edf3; overflow-x: hidden; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(22, 27, 34, 0.95); padding: 10px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 20px; color: var(--neon); text-shadow: 0 0 10px var(--neon); margin-bottom: 5px; }
        .nav-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .nav-links a { text-decoration: none; color: #c9d1d9; font-weight: bold; text-transform: uppercase; font-size: 12px; padding: 5px; cursor: pointer; transition: var(--transition); }
        .nav-links a:hover { color: var(--neon); transform: scale(1.1); }
        .nav-auth { margin-top: 5px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: var(--transition); display: inline-block; }
        .nav-auth a:hover { background: var(--neon); color: var(--bg); transform: scale(1.15); box-shadow: 0 0 15px var(--neon); }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 15px 0; }
            .logo { position: absolute; left: 30px; margin-bottom: 0; font-size: 24px; }
            .nav-links { gap: 30px; }
            .nav-links a { font-size: 14px; }
            .nav-auth { position: absolute; right: 30px; margin-top: 0; }
        }

        @keyframes fadeOutLeft { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-50px); filter: blur(5px); } }
        @keyframes fadeInRight { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }
        .animate-out { animation: fadeOutLeft 0.6s forwards; }
        .animate-in { animation: fadeInRight 0.6s forwards; }

        .sub-page { padding: 140px 15px 50px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(13,17,23,0.8), rgba(13,17,23,0.8)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
        .content-box { background: var(--card-bg); padding: 30px; border-radius: 15px; border: 1px solid rgba(0, 242, 255, 0.3); width: 100%; max-width: 800px; backdrop-filter: blur(8px); box-sizing: border-box; transition: var(--transition); }
        
        .course-card { background: rgba(22, 27, 34, 0.9); border: 1px solid var(--neon); border-radius: 12px; width: 100%; max-width: 650px; margin-bottom: 25px; padding: 25px; text-align: left; transition: var(--transition); cursor: pointer; }
        .course-card:hover { transform: scale(1.03) translateY(-5px); box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3); }
        .course-info { font-size: 14px; line-height: 1.6; color: #8b949e; margin-top: 10px; }

        .btn { background: transparent; color: var(--neon); padding: 12px 30px; text-decoration: none; border: 2px solid var(--neon); border-radius: 6px; font-weight: bold; transition: var(--transition); display: inline-block; cursor: pointer; margin: 10px; font-family: inherit; }
        .btn:hover { background: var(--neon); color: var(--bg); transform: scale(1.1); box-shadow: 0 0 30px var(--neon); }
        
        input { width: 100%; padding: 14px; margin: 10px 0; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        .form-container { background: var(--card-bg); padding: 35px; border-radius: 12px; border: 1px solid var(--neon); width: 100%; max-width: 420px; }
    </style>
</head>
<body>

<div id="content"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBYCGK00rBT6tfK0QXpFnFijP_23TfmJi0",
        authDomain: "://firebaseapp.com",
        projectId: "recordstudio-26d22",
        storageBucket: "recordstudio-26d22.firebasestorage.app",
        messagingSenderId: "794238287571",
        appId: "1:794238287571:web:266a02e9cb1999cc0e5e26",
        measurementId: "G-D4V92FXJZG"
    };

    let db;

    function checkFirebase() {
        if (typeof firebase !== 'undefined' && firebase.apps) {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            render();
        } else {
            setTimeout(checkFirebase, 500);
        }
    }

    checkFirebase();

    function navigate(page) {
        const content = document.getElementById('content');
        content.classList.add('animate-out');
        setTimeout(() => {
            const url = new URL(window.location);
            if (page === 'home') url.searchParams.delete('page');
            else url.searchParams.set('page', page);
            window.history.pushState({}, '', url);
            content.classList.remove('animate-out');
            render();
            content.classList.add('animate-in');
            setTimeout(() => content.classList.remove('animate-in'), 600);
        }, 500);
    }

    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        
        const navHtml = `<nav><div class="logo">🖥️ РЕКОРД</div><div class="nav-links"><a onclick="navigate('home')">Главная</a><a onclick="navigate('about')">О нас</a><a onclick="navigate('services')">Курсы</a><a onclick="navigate('contacts')">Контакты</a></div><div class="nav-auth">${currentUser ? `<a onclick="navigate('profile')">Профиль</a>` : `<a onclick="navigate('choice')">Войти</a>`}</div></nav>`;

        let pc = "";
        if (page === 'about') {
            pc = `<div class="sub-page"><div class="content-box"><h1>О НАС</h1><p>Code Studio «РЕКОРД» — это современная облачная экосистема обучения. Мы готовим элиту IT-индустрии.</p></div></div>`;
        } else if (page === 'services') {
            pc = `
                <div class="sub-page">
                    <h1>КУРСЫ</h1>
                    <div class="course-card" onclick="alert('Оплата в разработке')">
                        <h2>Python Developer</h2>
                        <p><strong>6 месяцев | 45 000 ₽</strong></p>
                        <div class="course-info">Освоение синтаксиса, бэкенд на Django и FastAPI. Работа с базами данных PostgreSQL.</div>
                    </div>
                    <div class="course-card" onclick="alert('Оплата в разработке')">
                        <h2>AI & Neural Networks</h2>
                        <p><strong>9 месяцев | 65 000 ₽</strong></p>
                        <div class="course-info">Глубокое погружение в Machine Learning. Обучение моделей на PyTorch и NLP.</div>
                    </div>
                </div>`;
        } else if (page === 'profile') {
            pc = `<div class="sub-page"><div class="content-box"><h1>ПРОФИЛЬ</h1><p>Привет, <strong>${currentUser.fio}</strong>!</p><button class="btn" onclick="logout()">ВЫЙТИ</button></div></div>`;
        } else if (page === 'login') {
            pc = `<div class="sub-page"><div class="form-container"><h2>ВХОД</h2><input type="text" id="logLogin" placeholder="Логин"><input type="password" id="logPass" placeholder="Пароль"><button class="btn" onclick="login()">ВОЙТИ</button></div></div>`;
        } else if (page === 'register') {
            pc = `<div class="sub-page"><div class="form-container"><h2>РЕГИСТРАЦИЯ</h2><input type="text" id="regFio" placeholder="ФИО"><input type="text" id="regLogin" placeholder="Логин"><input type="password" id="regPass" placeholder="Пароль"><button class="btn" onclick="register()">СОЗДАТЬ</button></div></div>`;
        } else if (page === 'choice') {
            pc = `<div class="sub-page"><div class="content-box"><h1>ВХОД В СИСТЕМУ</h1><button class="btn" onclick="navigate('login')">ЛОГИН</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div></div>`;
        } else if (page === 'contacts') {
            pc = `<div class="sub-page"><div class="content-box"><h1>КОНТАКТЫ</h1><p>Email: headquarters@record.studio</p><p>Telegram: @HaLdjr</p></div></div>`;
        } else {
            pc = `<div class="sub-page"><div class="content-box"><h1>CODE STUDIO «РЕКОРД»</h1><p>Твой путь в IT. Все данные теперь в облаке.</p><button class="btn" onclick="navigate('choice')">ВОЙТИ В СИСТЕМУ</button></div></div>`;
        }
        contentDiv.innerHTML = navHtml + pc;
    }

    window.register = async function() {
        // Берем все 4 поля из твоей формы
        const fio = document.getElementById('regFio').value;
        const login = document.getElementById('regLogin').value;
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        
        if(!fio || !login || !email || !pass || !db) return alert("Заполни все поля!");

        try {
            // Сохраняем расширенный профиль
            await db.collection("users").doc(login).set({
                fio: fio,
                login: login,
                email: email,
                pass: pass,
                regDate: new Date()
            });
            alert("Регистрация успешна!");
            navigate('login');
        } catch (e) { 
            alert("Ошибка записи: " + e.message); 
        }
    }

    window.login = async function() {
        const login = document.getElementById('logLogin').value;
        const pass = document.getElementById('logPass').value;
        if(!db) return;
        try {
            const doc = await db.collection("users").doc(login).get();
            if (doc.exists && doc.data().pass === pass) {
                // Сохраняем все данные пользователя в сессию
                sessionStorage.setItem('currentUser', JSON.stringify(doc.data()));
                navigate('profile');
            } else { alert("Неверные данные!"); }
        } catch (e) { alert("Ошибка входа."); }
    }


    window.logout = function() { sessionStorage.removeItem('currentUser'); navigate('home'); }
    window.onpopstate = render;
</script>
</body>
</html>
