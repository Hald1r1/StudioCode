<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <style>
        :root {
            --neon: #0077ff; 
            --neon-glow: rgba(0, 119, 255, 0.4);
            --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); 
            --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; }

        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 11px; font-weight: bold; transition: var(--transit); cursor: pointer; }

        @media (min-width: 768px) {
            nav { flex-direction: row; justify-content: center; padding: 20px 0; }
            .logo { position: absolute; left: 40px; }
            .nav-links { margin-top: 0; gap: 40px; }
            .nav-auth { position: absolute; right: 40px; margin-top: 0; }
        }

        @keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 1100px; }
        .sub-page { padding: 140px 20px 80px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.2); width: 100%; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 3px; color: var(--neon); margin-bottom: 20px; font-size: 32px; text-align: center; }
        h3 { color: var(--neon); margin-top: 25px; border-left: 3px solid var(--neon); padding-left: 15px; }

        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; margin-top: 30px; }
        .course-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 20px; padding: 30px; transition: var(--transit); cursor: pointer; }
        .course-card:hover { border-color: var(--neon); transform: translateY(-5px); box-shadow: 0 0 20px var(--neon-glow); }

        .btn { background: transparent; color: var(--neon); padding: 14px 25px; border: 2px solid var(--neon); border-radius: 8px; font-weight: bold; transition: var(--transit); cursor: pointer; text-transform: uppercase; font-family: 'Consolas', monospace; font-size: 13px; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--neon); }

        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: #0a0c10; border: 2px solid var(--neon); border-radius: 20px; padding: 40px; text-align: center; width: 350px; }
        
        input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; }
        .bank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .bank-btn { padding: 12px; border: 1px solid #333; border-radius: 8px; color: #fff; text-decoration: none; text-align: center; font-size: 13px; transition: 0.3s; }
        .bank-btn:hover { border-color: var(--neon); background: rgba(0,119,255,0.1); }
    </style>
</head>
<body>

<div id="status-overlay">
    <div class="status-card">
        <div id="status-text" style="font-family: monospace;"></div>
        <button id="status-close" class="btn" style="display:none; margin-top:20px" onclick="hideStatus()">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="content"></div>

<script>
    // Имитация БД
    let isLogged = sessionStorage.getItem('isLogged') === 'true';

    function showStatus(text, showClose = false) {
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
    }
    function hideStatus() { document.getElementById('status-overlay').style.display = 'none'; }

    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        url.searchParams.forEach((v, k) => url.searchParams.delete(k));
        url.searchParams.set('page', page);
        Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
        window.history.pushState({}, '', url);
        render();
    };

    window.handleAuth = function() {
        sessionStorage.setItem('isLogged', 'true');
        isLogged = true;
        const lastPage = new URLSearchParams(window.location.search).get('from');
        if(lastPage === 'order') {
            const item = new URLSearchParams(window.location.search).get('item');
            const price = new URLSearchParams(window.location.search).get('price');
            navigate('order', {item, price});
        } else {
            navigate('profile');
        }
    };

    function render() {
        const params = new URLSearchParams(window.location.search);
        const page = params.get('page') || 'home';
        const contentDiv = document.getElementById('content');
        
        let nav = `<nav>
            <div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div>
            <div class="nav-links">
                <a onclick="navigate('home')">Главная</a>
                <a onclick="navigate('services')">Курсы</a>
                <a onclick="navigate('about')">О нас</a>
                <a onclick="navigate('contacts')">Контакты</a>
            </div>
            <div class="nav-auth">
                ${isLogged ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('login')">ВОЙТИ</a>`}
            </div>
        </nav>`;

        let pc = "";
        const wrap = (html) => `<div class="sub-page"><div class="animate-page">${html}</div></div>`;

        if (page === 'home') {
            pc = wrap(`<h1>RECORD CODE STUDIO</h1><p style="text-align:center">Элитное IT-образование. Практика на реальных проектах.</p><button class="btn" style="margin-top:30px" onclick="navigate('services')">Курсы</button>`);
        } 
        else if (page === 'login') {
            pc = wrap(`<div class="content-box" style="max-width:400px; text-align:center"><h1>ВХОД</h1><input placeholder="Логин"><input type="password" placeholder="Пароль"><button class="btn" style="width:100%; margin-top:10px" onclick="handleAuth()">ВОЙТИ</button></div>`);
        }
        else if (page === 'profile') {
            pc = wrap(`<div class="content-box"><h1>МОЙ ПРОФИЛЬ</h1><p>Добро пожаловать в личный кабинет!</p><p>Статус: <b>Студент</b></p><button class="btn" onclick="sessionStorage.clear(); location.reload()">ВЫЙТИ</button></div>`);
        }
        else if (page === 'services') {
            const buyAction = (item, price) => isLogged ? `navigate('order', {item:'${item}', price:'${price}'})` : `navigate('login', {from:'order', item:'${item}', price:'${price}'})`;
            pc = wrap(`<h1>КУРСЫ</h1><div class="course-grid">
                <div class="course-card" onclick="${buyAction('Python Pro', '45000')}"><h3>Python Pro</h3><div style="color:var(--neon)">45 000 ₽</div></div>
                <div class="course-card" onclick="${buyAction('AI Engineer', '65000')}"><h3>AI Engineer</h3><div style="color:var(--neon)">65 000 ₽</div></div>
            </div>`);
        }
        else if (page === 'contacts') {
            pc = wrap(`<div class="content-box"><h1>КОНТАКТЫ</h1><p>📍 Москва, Сити</p><p>📞 +7 (495) 000-00-00</p><p>✈️ Telegram: <a href="https://t.me" style="color:var(--neon)">@record_code</a></p></div>`);
        }
        else if (page === 'order') {
            const item = params.get('item'), price = params.get('price');
            pc = wrap(`
                <div class="content-box" style="max-width: 500px; text-align: center">
                    <h1>ОПЛАТА</h1>
                    <p>${item} | <b>${price} ₽</b></p>
                    <div id="p-main">
                        <button class="btn" style="width:100%; margin-bottom:10px" onclick="document.getElementById('card-f').style.display='block'; document.getElementById('p-main').style.display='none'">КАРТА</button>
                        <button class="btn" style="width:100%" onclick="document.getElementById('sbp-f').style.display='block'; document.getElementById('p-main').style.display='none'">СБП</button>
                        <button class="btn" style="width:100%; border-color:#333; color:#555; margin-top:20px" onclick="navigate('services')">ОТМЕНА</button>
                    </div>
                    <div id="card-f" style="display:none">
                        <input placeholder="Номер карты"><button class="btn" style="width:100%" onclick="showStatus('Успешно!', true)">ОПЛАТИТЬ</button>
                        <button class="btn" style="width:100%; border-color:#333; margin-top:10px" onclick="document.getElementById('card-f').style.display='none'; document.getElementById('p-main').style.display='block'">НАЗАД</button>
                    </div>
                    <div id="sbp-f" style="display:none">
                        <div class="bank-grid">
                            <a href="#" class="bank-btn">СБЕРБАНК</a><a href="#" class="bank-btn">Т-БАНК</a>
                            <a href="#" class="bank-btn">АЛЬФА</a><a href="#" class="bank-btn">ВТБ</a>
                            <a href="#" class="bank-btn">РАЙФФАЙЗЕН</a><a href="#" class="bank-btn">ГАЗПРОМ</a>
                        </div>
                        <button class="btn" style="width:100%; border-color:#333; margin-top:20px" onclick="document.getElementById('sbp-f').style.display='none'; document.getElementById('p-main').style.display='block'">НАЗАД</button>
                    </div>
                </div>`);
        }

        contentDiv.innerHTML = nav + pc;
    }

    window.onpopstate = render;
    render();
</script>
</body>
</html>
