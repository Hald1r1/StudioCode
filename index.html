<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Studio «РЕКОРД» | Pro Edition</title>
    <link rel="icon" href="image.png" type="image/png">
    <style>
        :root {
            --neon: #0077ff; --neon-glow: rgba(0, 119, 255, 0.4); --bg: #05070a;
            --card-bg: rgba(10, 12, 16, 0.98); --transit: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; min-height: 100%; font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: #ffffff; overflow-x: hidden; scroll-behavior: smooth; }
        
        /* Навигация */
        nav { position: fixed; top: 0; width: 100%; background: rgba(5, 7, 10, 0.95); backdrop-filter: blur(20px); padding: 15px 0; border-bottom: 2px solid var(--neon); z-index: 1000; display: flex; flex-direction: column; align-items: center; }
        .logo { font-size: 24px; color: var(--neon); text-shadow: 0 0 15px var(--neon); font-weight: bold; cursor: pointer; transition: var(--transit); }
        .nav-links { display: flex; gap: 20px; margin-top: 10px; }
        .nav-links a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: var(--transit); }
        .nav-links a:hover { color: var(--neon); }
        .nav-auth { margin-top: 10px; }
        .nav-auth a { text-decoration: none; color: var(--neon); border: 1px solid var(--neon); padding: 6px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; transition: var(--transit); cursor: pointer; }
        .nav-auth a:hover { background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon); }
        @media (min-width: 768px) { nav { flex-direction: row; justify-content: center; padding: 20px 0; } .logo { position: absolute; left: 40px; } .nav-links { margin-top: 0; gap: 40px; } .nav-auth { position: absolute; right: 40px; margin-top: 0; } }

        /* Анимации */
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); filter: blur(2px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
        .animate-page { animation: pageIn 0.4s ease-out forwards; display: flex; flex-direction: column; align-items: center; width: 100%; }

        .sub-page { padding: 160px 20px 80px; text-align: center; min-height: 100vh; background: linear-gradient(rgba(5, 7, 10, 0.9), rgba(5, 7, 10, 0.9)), url('geekbot_ru_1776150134725.png') no-repeat center 20%; background-size: cover; background-attachment: fixed; display: flex; flex-direction: column; align-items: center; }
        .content-box { background: var(--card-bg); padding: 40px; border-radius: 24px; border: 1px solid rgba(0, 119, 255, 0.2); width: 100%; max-width: 950px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); margin-bottom: 30px; }
        
        h1 { font-family: 'Consolas', monospace; text-transform: uppercase; letter-spacing: 4px; color: var(--neon); margin-bottom: 25px; font-size: 32px; }
        h2 { color: var(--neon); margin-top: 35px; font-size: 22px; text-transform: uppercase; border-left: 3px solid var(--neon); padding-left: 15px; text-align: left; }

        /* Курсы */
        .course-grid { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 900px; margin-top: 30px; }
        .course-card { background: var(--card-bg); border: 1px solid rgba(0, 119, 255, 0.3); border-radius: 20px; padding: 40px; text-align: left; transition: var(--transit); cursor: pointer; position: relative; overflow: hidden; }
        .course-card:hover { border-color: var(--neon); box-shadow: 0 15px 40px var(--neon-glow); transform: translateY(-5px); }
        .course-card h3 { color: var(--neon); font-size: 26px; margin-bottom: 10px; }
        .course-card .price { font-weight: bold; color: #ffffff; font-size: 22px; margin-bottom: 20px; display: block; }
        .course-card ul { padding-left: 20px; color: #c9d1d9; line-height: 1.8; }
        .course-card .tech-tags { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .tag { background: rgba(0, 119, 255, 0.1); border: 1px solid var(--neon); color: var(--neon); padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* FAQ */
        .faq-item { text-align: left; margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 15px; }
        .faq-q { color: var(--neon); font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .faq-a { color: #8b949e; line-height: 1.6; }

        .btn { background: transparent; color: var(--neon); padding: 15px 35px; border: 2px solid var(--neon); border-radius: 10px; font-weight: bold; transition: var(--transit); cursor: pointer; margin: 10px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Consolas', monospace; }
        .btn:hover { background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); transform: scale(1.02); }

        .form-container { background: var(--card-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--neon); width: 100%; max-width: 450px; }
        input { width: 100%; padding: 14px; margin: 10px 0; background: rgba(0,0,0,0.8); border: 1px solid #333; color: white; border-radius: 8px; font-size: 16px; transition: 0.2s; }
        input:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 10px var(--neon-glow); }
        
        #status-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .status-card { background: var(--card-bg); border: 2px solid var(--neon); border-radius: 20px; padding: 40px 50px; text-align: center; box-shadow: 0 0 50px var(--neon-glow); max-width: 90%; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="status-overlay"><div class="status-card"><div id="status-text" style="font-family:Consolas; font-size:18px; text-transform:uppercase;"></div><div id="status-loader" style="margin-top:20px;"><div style="width:40px; height:40px; border:4px solid #111; border-top:4px solid var(--neon); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block;"></div></div><button id="status-close" class="btn" style="display:none; margin-top:25px; font-size:12px;" onclick="hideStatus(0)">ЗАКРЫТЬ</button></div></div>
<div id="content"></div>
<script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbwP9AX2NA6AuGhxyZFD-OVSvPnEb1WDsmvBBWEtoT0lu81JEDvq50mnLYuxfa05la-QEw/exec';
    let safetyTimer;

    // Утилиты интерфейса
    function showStatus(text, showLoader = true, showClose = false) {
        clearTimeout(safetyTimer);
        document.getElementById('status-overlay').style.display = 'flex';
        document.getElementById('status-text').innerText = text;
        document.getElementById('status-loader').style.display = showLoader ? 'inline-block' : 'none';
        document.getElementById('status-close').style.display = showClose ? 'inline-block' : 'none';
        if(showLoader) safetyTimer = setTimeout(() => { showStatus("СЕРВЕР ЗАДЕРЖИВАЕТСЯ. ПОПРОБУЙТЕ СНОВА", false, true); }, 12000);
    }

    function hideStatus(delay = 400) { 
        clearTimeout(safetyTimer); 
        setTimeout(() => { document.getElementById('status-overlay').style.display = 'none'; }, delay); 
    }

    // Навигация (SPA)
    window.navigate = function(page, params = {}) {
        const url = new URL(window.location);
        if (page === 'home') {
            Array.from(url.searchParams.keys()).forEach(k => url.searchParams.delete(k));
        } else {
            url.searchParams.set('page', page);
            Object.keys(params).forEach(key => url.searchParams.set(key, params[key]));
        }
        window.history.pushState({}, '', url);
        render();
        window.scrollTo(0,0);
    };

    window.openPayment = function(name, price) {
        window.open(`${window.location.origin}${window.location.pathname}?page=order&item=${encodeURIComponent(name)}&price=${encodeURIComponent(price)}`, '_blank');
    };

    // Отрисовка контента
    function render() {
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page');
        const contentDiv = document.getElementById('content');
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        
        // Исправленная навигация
        const nav = `
            <nav>
                <div class="logo" onclick="navigate('home')">🖥️ РЕКОРД</div>
                <div class="nav-links">
                    <a onclick="navigate('home')">Главная</a>
                    <a onclick="navigate('about')">О нас</a>
                    <a onclick="navigate('services')">Курсы</a>
                    <a onclick="navigate('contacts')">Контакты</a>
                </div>
                <div class="nav-auth">
                    ${user ? `<a onclick="navigate('profile')">ПРОФИЛЬ</a>` : `<a onclick="navigate('choice')">ВОЙТИ</a>`}
                </div>
            </nav>`;

        let pc = "";
        const wrap = (content) => `<div class="sub-page"><div class="animate-page">${content}</div></div>`;

        if (page === 'services') {
            pc = wrap(`
                <h1>ПРОГРАММЫ ОБУЧЕНИЯ</h1>
                <div class="course-grid">
                    <!-- PYTHON -->
                    <div class="course-card" onclick="openPayment('Python Developer Pro', '45 000')">
                        <h3>Python Developer Pro</h3>
                        <span class="price">45 000 ₽ | 6 месяцев</span>
                        <ul>
                            <li><b>Backend:</b> Django 4, FastAPI, архитектура REST и gRPC.</li>
                            <li><b>Data:</b> PostgreSQL, Redis, оптимизация SQL-запросов.</li>
                            <li><b>DevOps:</b> Docker, CI/CD, работа с Linux-серверами.</li>
                            <li><b>Итог:</b> Создание высоконагруженного маркетплейса с микросервисами.</li>
                        </ul>
                        <div class="tech-tags">
                            <span class="tag">Django</span><span class="tag">FastAPI</span><span class="tag">Docker</span>
                        </div>
                    </div>

                    <!-- AI -->
                    <div class="course-card" onclick="openPayment('Neural Networks & AI', '65 000')">
                        <h3>Neural Networks & AI</h3>
                        <span class="price">65 000 ₽ | 9 месяцев</span>
                        <ul>
                            <li><b>Math:</b> Линейная алгебра и статистика для Data Science.</li>
                            <li><b>Vision:</b> Computer Vision на OpenCV и PyTorch.</li>
                            <li><b>LLM:</b> Обучение и дообучение моделей уровня GPT и Llama.</li>
                            <li><b>Итог:</b> Своя нейросеть для анализа корпоративных данных.</li>
                        </ul>
                        <div class="tech-tags">
                            <span class="tag">PyTorch</span><span class="tag">NLP</span><span class="tag">Deep Learning</span>
                        </div>
                    </div>

                    <!-- CYBER -->
                    <div class="course-card" onclick="openPayment('Cyber Security Expert', '80 000')">
                        <h3>Cyber Security Expert</h3>
                        <span class="price">80 000 ₽ | 12 месяцев</span>
                        <ul>
                            <li><b>Attack:</b> Методы взлома веб-приложений (OWASP Top 10).</li>
                            <li><b>Defense:</b> Настройка систем мониторинга и защиты трафика.</li>
                            <li><b>Reverse:</b> Реверс-инжиниринг и поиск дыр в коде.</li>
                            <li><b>Итог:</b> Аудит безопасности крупной IT-инфраструктуры.</li>
                        </ul>
                        <div class="tech-tags">
                            <span class="tag">Kali Linux</span><span class="tag">Pentest</span><span class="tag">Exploit</span>
                        </div>
                    </div>
                </div>`);
        }
        else if (page === 'contacts') {
            pc = wrap(`
                <div class="content-box">
                    <h1>СВЯЗЬ С НАМИ</h1>
                    <p style="font-size: 20px; margin-bottom:30px;">Мы на связи 24/7 для решения ваших вопросов.</p>
                    <div style="text-align:left; display:inline-block;">
                        <p>🔹 <b>Telegram:</b> <a href="https://t.me" style="color:var(--neon); text-decoration:none;">@HaLdjr</a></p>
                        <p>🔹 <b>Email:</b> support@record-studio.pro</p>
                        <p>🔹 <b>Сотрудничество:</b> biz@record-studio.pro</p>
                    </div>
                    <p style="margin-top:30px; color:#8b949e;">Среднее время ответа администратора: 15 минут.</p>
                </div>`);
        }
        else if (page === 'order') {
            const item = urlParams.get('item'), price = urlParams.get('price');
            pc = wrap(`
                <div class="content-box" style="max-width: 650px">
                    <h1>ОФОРМЛЕНИЕ</h1>
                    <p style="font-size: 22px; color: var(--neon); font-weight: bold;">${item}</p>
                    <p style="font-size: 26px; border-bottom: 1px solid #333; padding-bottom: 20px;">К оплате: ${price} ₽</p>
                    <div id="pay-scr">
                        <p>ВЫБЕРИТЕ МЕТОД ОПЛАТЫ:</p>
                        <div style="display:flex; gap:20px; margin-top:20px">
                            <button class="btn" style="flex:1" onclick="document.getElementById('card-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">💳 КАРТА</button>
                            <button class="btn" style="flex:1" onclick="document.getElementById('sbp-scr').style.display='block'; document.getElementById('pay-scr').style.display='none'">📲 СБП</button>
                        </div>
                    </div>
                    <div id="card-scr" style="display:none">
                        <p>ДАННЫЕ КАРТЫ:</p>
                        <input type="text" id="c_num" placeholder="Номер карты" maxlength="19" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g, '$1 ').trim()">
                        <div style="display:flex; gap:10px">
                            <input type="text" id="c_date" placeholder="ММ / ГГ" maxlength="7" oninput="this.value=this.value.replace(/\\D/g,'').replace(/^(\\d{2})(\\d)/, '$1 / $2').substring(0, 7)">
                            <input type="text" id="c_cvc" placeholder="CVC" maxlength="3" oninput="this.value=this.value.replace(/\\D/g,'')">
                        </div>
                        <button class="btn" style="width:100%; margin-top:20px" onclick="processPay()">ОПЛАТИТЬ</button>
                        <button class="btn" style="width:100%; border-color:#444; color:#666;" onclick="document.getElementById('pay-scr').style.display='block'; document.getElementById('card-scr').style.display='none'">НАЗАД</button>
                    </div>
                    <div id="sbp-scr" style="display:none">
                        <p>ВЫБЕРИТЕ БАНК:</p>
                        <div class="bank-grid">
                            <a href="https://sberbank.ru" target="_blank" class="bank-btn">СБЕРБАНК</a>
                            <a href="https://tbank.ru" target="_blank" class="bank-btn">Т-БАНК</a>
                            <a href="https://alfabank.ru" target="_blank" class="bank-btn">АЛЬФА-БАНК</a>
                            <a href="https://vtb.ru" target="_blank" class="bank-btn">ВТБ</a>
                        </div>
                        <button class="btn" style="width:100%; margin-top:20px; border-color:#444; color:#666;" onclick="document.getElementById('pay-scr').style.display='block'; document.getElementById('sbp-scr').style.display='none'">НАЗАД</button>
                    </div>
                </div>`);
        }
        else if (page === 'choice') {
            pc = wrap(`<div class="content-box"><h1>ДОСТУП</h1><button class="btn" onclick="navigate('login')">ЛОГИН</button><button class="btn" onclick="navigate('register')">РЕГИСТРАЦИЯ</button></div>`);
        }
        else if (page === 'login') {
            pc = wrap(`<div class="form-container"><h1>ВХОД</h1><input type="text" id="lLog" placeholder="Логин"><input type="password" id="lPas" placeholder="Пароль"><button class="btn" onclick="login()">ВОЙТИ</button><div class="form-footer">Нет аккаунта? <a onclick="navigate('register')">Создать</a></div></div>`);
        }
        else if (page === 'register') {
            pc = wrap(`<div class="form-container" id="reg-box"><h1>РЕГИСТРАЦИЯ</h1><input type="text" id="rFio" placeholder="Полное ФИО"><input type="text" id="rLog" placeholder="Логин"><input type="email" id="rEma" placeholder="Email"><input type="password" id="rPas" placeholder="Пароль"><button class="btn" onclick="checkUnique()">ПОЛУЧИТЬ КОД</button></div>
                       <div class="form-container" id="verify-box" style="display:none"><h1>ПОДТВЕРЖДЕНИЕ</h1><p style="font-size:14px; color:#8b949e; margin-bottom:15px">Код отправлен на почту</p><input type="text" id="vCode" placeholder="6-значный код" maxlength="6"><button class="btn" onclick="finishReg()">СОЗДАТЬ АККАУНТ</button></div>`);
        }
        else if (page === 'profile') {
            pc = wrap(`<div class="content-box"><h1>КАБИНЕТ</h1><p style="font-size:22px;">Привет, <span style="color:var(--neon)">${user?.fio}</span>!</p><p>Ваш Email: ${user?.ema}</p><button class="btn" onclick="sessionStorage.removeItem('currentUser'); navigate('home');">ВЫЙТИ</button></div>`);
        }
        else {
            pc = wrap(`<div class="content-box"><h1>CODE STUDIO «РЕКОРД»</h1><p>Инженерное образование будущего. Практика на реальных кейсах.</p><button class="btn" onclick="${user ? 'navigate(\'profile\')' : 'navigate(\'choice\')'}">${user ? 'В ЛИЧНЫЙ КАБИНЕТ' : 'ВХОД В СИСТЕМУ'}</button></div>`);
        }
        contentDiv.innerHTML = nav + pc;
    }

    // --- ЛОГИКА БАЗЫ ---
    window.checkUnique = function() {
        const f = document.getElementById('rFio').value, l = document.getElementById('rLog').value, e = document.getElementById('rEma').value, p = document.getElementById('rPas').value;
        if(!f || !l || !e || !p) return showStatus("ЗАПОЛНИТЕ ВСЕ ПОЛЯ!", false, true);
        window.regData = {f, l, e, p};
        showStatus("ПРОВЕРКА ДАННЫХ...");
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?callback=onCheckResult&t=${Date.now()}`;
        document.body.appendChild(s);
    };

    window.onCheckResult = function(users) {
        const isEmailTaken = users.find(u => String(u.ema).toLowerCase() === window.regData.e.toLowerCase());
        const isLoginTaken = users.find(u => String(u.login).toLowerCase() === window.regData.l.toLowerCase());
        if(isEmailTaken) return showStatus("ЭТА ПОЧТА УЖЕ ЗАНЯТА!", false, true);
        if(isLoginTaken) return showStatus("ЭТОТ ЛОГИН УЖЕ ЗАНЯТ!", false, true);
        
        showStatus("ОТПРАВЛЯЕМ КОД...");
        window.generatedCode = Math.floor(100000 + Math.random() * 900000);
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?method=sendCode&ema=${encodeURIComponent(window.regData.e)}&code=${window.generatedCode}&callback=onCodeSent&t=${Date.now()}`;
        document.body.appendChild(s);
    };

    window.onCodeSent = () => { hideStatus(); document.getElementById('reg-box').style.display = 'none'; document.getElementById('verify-box').style.display = 'block'; };

    window.finishReg = function() {
        if(document.getElementById('vCode').value != window.generatedCode) return showStatus("НЕВЕРНЫЙ КОД!", false, true);
        showStatus("РЕГИСТРАЦИЯ...");
        const s = document.createElement('script');
        s.src = `${SHEET_URL}?method=register&fio=${encodeURIComponent(window.regData.f)}&login=${encodeURIComponent(window.regData.l)}&ema=${encodeURIComponent(window.regData.e)}&pass=${encodeURIComponent(window.regData.p)}&callback=onRegOk&t=${Date.now()}`;
        document.body.appendChild(s);
    };

    window.onRegOk = () => { showStatus("УСПЕШНО!", false); setTimeout(() => { hideStatus(); navigate('login'); }, 1500); };

    window.login = function() {
        const l = document.getElementById('lLog').value, p = document.getElementById('lPas').value;
        if(!l || !p) return showStatus("ВВЕДИТЕ ДАННЫЕ!", false, true);
        showStatus("ПРОВЕРКА..."); window.tempL = l; window.tempP = p;
        const s = document.createElement('script'); s.src = `${SHEET_URL}?callback=onLoginResult&t=${Date.now()}`; document.body.appendChild(s);
    };

    window.onLoginResult = (users) => {
        const u = users.find(x => String(x.login) === window.tempL && String(x.pass) === window.tempP);
        if(u) { showStatus("УСПЕШНЫЙ ВХОД!", false); sessionStorage.setItem('currentUser', JSON.stringify(u)); setTimeout(() => { hideStatus(); navigate('profile'); }, 1500); }
        else { showStatus("ОШИБКА: ДАННЫЕ НЕВЕРНЫ!", false, true); }
    };

    window.processPay = function() {
        if(document.getElementById('c_num').value.length < 19) return showStatus("ПРОВЕРЬТЕ НОМЕР КАРТЫ!", false, true);
        showStatus("ОБРАБОТКА...");
        setTimeout(() => { showStatus("УСПЕШНО ОПЛАЧЕНО!", false); setTimeout(() => { hideStatus(); window.close(); }, 2500); }, 1500);
    };

    window.onpopstate = render; render();
</script>
</body>
</html>
